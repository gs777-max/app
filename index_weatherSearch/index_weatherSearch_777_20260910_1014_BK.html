<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>SmartWeather Pro | 新世代・高精度スマート天気予報</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Open-Meteoの高精度気象データを活用した新世代天気予報アプリ。GPS現在地取得、24時間予報、気圧・天気痛アラート、気温トレンドグラフ、生活指数ダッシュボードを搭載。" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Zen Kaku Gothic New"', '"Outfit"', 'sans-serif'],
            display: ['"Outfit"', '"Zen Kaku Gothic New"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(226, 232, 240, 0.8);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      border-color: rgba(56, 189, 248, 0.5);
    }
    .custom-scroll::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.6);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.5);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.7);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-800 antialiased relative overflow-x-hidden font-sans transition-colors duration-700" id="bodyBg">

  <!-- 天候・時間帯連動の動的アンビエント背景 -->
  <div class="fixed inset-0 pointer-events-none z-0 transition-opacity duration-1000" id="ambientBgLayer">
    <div id="ambientGradient" class="absolute inset-0 bg-gradient-to-br from-sky-400/20 via-indigo-200/20 to-blue-600/10"></div>
    <div class="absolute -top-32 -left-20 w-96 h-96 rounded-full bg-sky-300/30 blur-3xl"></div>
    <div class="absolute top-1/3 -right-20 w-96 h-96 rounded-full bg-indigo-300/25 blur-3xl"></div>
    <div class="absolute -bottom-20 left-1/4 w-96 h-96 rounded-full bg-emerald-200/20 blur-3xl"></div>
  </div>

  <!-- メインコンテナ -->
  <div class="relative z-10 max-w-6xl mx-auto px-3 sm:px-6 py-6 sm:py-10">

    <!-- ヘッダーエリア -->
    <header class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 text-white shadow-md shadow-sky-500/25 text-xl font-bold">
            ⛅
          </span>
          <div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center gap-2">
              SmartWeather <span class="bg-gradient-to-r from-sky-400 to-indigo-300 bg-clip-text text-transparent font-display">PRO</span>
            </h1>
            <p class="text-xs text-slate-300 mt-0.5">
              高精度気象データ × 24hタイムライン × 気圧・天気痛アラート × 生活指数
            </p>
          </div>
        </div>
      </div>

      <!-- ヘッダー右上コントロール（単位切替・共有・更新） -->
      <div class="flex items-center flex-wrap gap-2">
        <button
          id="btnGeoLocation"
          type="button"
          class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold bg-sky-500 hover:bg-sky-400 text-white shadow-sm transition active:scale-95 cursor-pointer"
          title="現在地の天気を取得"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          現在地で取得
        </button>

        <button
          id="btnRefresh"
          type="button"
          class="inline-flex items-center gap-1 px-3 py-2 rounded-xl text-xs font-medium bg-white/10 hover:bg-white/20 text-white border border-white/20 transition active:scale-95 cursor-pointer"
          title="最新情報に更新"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          更新
        </button>

        <button
          id="shareButton"
          type="button"
          class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium bg-white/10 hover:bg-white/20 text-white border border-white/20 transition active:scale-95 cursor-pointer"
          title="予報結果を共有 / コピー"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
          共有
        </button>

    </header>

            <label for="cityInput" class="block text-xs font-bold text-slate-700 mb-1 flex items-center justify-between">
              <span>都市名 / 地域名（日本語漢字・ひらがな・ローマ字対応）</span>
              <span id="geocodingSpinner" class="hidden text-sky-600 text-[11px] font-normal animate-pulse">候補を検索中...</span>
            </label>
            <div class="relative">
              <input
                id="cityInput"
                type="text"
                placeholder="例: 東京, 大阪, 札幌, さいたま, New York"
                value="東京"
                autocomplete="off"
                class="w-full pl-9 pr-8 py-2.5 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition shadow-sm"
              />
              <span class="absolute left-3 top-3 text-slate-400">

                title="入力をクリア"

            <!-- オートコンプリート・ドロップダウン -->

            </div>
          </div>

          <!-- 国コード（任意） -->
          <div class="sm:col-span-2">
            <label for="countryInput" class="block text-xs font-bold text-slate-700 mb-1">
              国コード
            </label>

              id="countryInput"
              type="text"
              placeholder="JP, US等 (任意)"
              value="JP"

          </div>

          <!-- 表示期間選択 -->
          <div class="sm:col-span-2">
            <label for="weeksSelect" class="block text-xs font-bold text-slate-700 mb-1">

            >
              <span>天気を表示</span>
            </button>
          </div>
        </div>

          <span class="text-[11px] font-semibold text-slate-500 whitespace-nowrap">主要都市:</span>
          <div class="flex items-center flex-wrap gap-1.5" id="quickCityChips">
            <button type="button" data-city="東京" data-country="JP" class="quick-chip px-2.5 py-1 text-xs rounded-lg bg-slate-100 hover:bg-sky-100 text-slate-700 hover:text-sky-700 transition cursor-pointer font-medium">東京</button>
            <button type="button" data-city="大阪" data-country="JP" class="quick-chip px-2.5 py-1 text-xs rounded-lg bg-slate-100 hover:bg-sky-100 text-slate-700 hover:text-sky-700 transition cursor-pointer font-medium">大阪</button>

            <button type="button" data-city="名古屋" data-country="JP" class="quick-chip px-2.5 py-1 text-xs rounded-lg bg-slate-100 hover:bg-sky-100 text-slate-700 hover:text-sky-700 transition cursor-pointer font-medium">名古屋</button>
            <button type="button" data-city="札幌" data-country="JP" class="quick-chip px-2.5 py-1 text-xs rounded-lg bg-slate-100 hover:bg-sky-100 text-slate-700 hover:text-sky-700 transition cursor-pointer font-medium">札幌</button>

            <span>履歴:</span>

        <div class="flex items-center justify-between text-xs text-slate-600 pt-1">
          <div class="flex items-center gap-4">
            <label class="inline-flex items-center gap-1.5 cursor-pointer">
              <input id="compactMode" type="checkbox" class="rounded text-sky-600 focus:ring-sky-500 h-3.5 w-3.5 cursor-pointer" />

          <div class="text-[11px] text-slate-400">
            データ提供: Open-Meteo (APIキー不要・完全無料)

        </div>

      <!-- ステータス・エラー通知バー -->
      <div id="statusBar" class="mt-3 hidden px-3.5 py-2 rounded-xl text-xs font-medium transition-all"></div>

      <div id="loadingPlaceholder" class="glass-panel rounded-2xl p-12 text-center text-slate-500 animate-pulse">
        <div class="text-4xl mb-3">⛅</div>
        <p class="text-sm font-semibold">気象データを読み込んでいます...</p>
        <p class="text-xs text-slate-400 mt-1">Open-Meteo から高精度な予報と気圧・時間別推移を取得中</p>
      </div>

    <footer class="mt-12 text-center text-xs text-slate-400 border-t border-slate-700/40 pt-6 pb-4">
      <p class="font-medium text-slate-300">SmartWeather Pro &mdash; 次世代スマート天気予報システム</p>
      <p class="mt-1 text-slate-400">

        完全無料・APIキー不要 &bull; いつでも快適なライフスタイルと健康管理をサポート

  </div>

      function findInLocalDict(query) {
        if (!query) return [];
        const q = query.toLowerCase().trim();
        const hits = [];
        for (const item of JAPAN_CITY_DICT) {
          if (item.name.includes(query) || item.admin.includes(query) || item.en.toLowerCase().includes(q)) {
            hits.push({
              name: item.name,
              latitude: item.lat,
              longitude: item.lon,
              country_code: 'JP',
              admin1: item.admin,
              en: item.en
            });
            continue;
          }
          for (const alias of item.aliases) {
            if (alias.toLowerCase().includes(q) || q.includes(alias.toLowerCase())) {
              hits.push({
                name: item.name,
                latitude: item.lat,
                longitude: item.lon,
                country_code: 'JP',
                admin1: item.admin,
                en: item.en
              });
              break;
            }
          }
        }
        return hits;
      }

      function initApp() {
        loadPreferences();
        renderRecentChips();
        bindEvents();
        const initialCity = cityInput.value.trim() || '東京';
        fetchForecastForCity(initialCity, countryInput.value.trim());
      }

      function loadPreferences() {
        try {
          const saved = JSON.parse(localStorage.getItem('smartWeatherPrefs_v2') || '{}');
          if (saved.city) cityInput.value = saved.city;
          if (saved.country) countryInput.value = saved.country;
          if (saved.weeks) weeksSelect.value = saved.weeks;
          if (typeof saved.compactMode === 'boolean') compactModeEl.checked = saved.compactMode;
          if (typeof saved.windUnitKmh === 'boolean') windUnitKmhEl.checked = saved.windUnitKmh;
          if (saved.city) btnClearCity.classList.remove('hidden');
        } catch (e) {}
      }

      function savePreferences() {
        try {
          const prefs = {
            city: cityInput.value.trim(),
            country: countryInput.value.trim().toUpperCase(),
            weeks: weeksSelect.value,
            compactMode: compactModeEl.checked,
            windUnitKmh: windUnitKmhEl.checked
          };
          localStorage.setItem('smartWeatherPrefs_v2', JSON.stringify(prefs));
        } catch (e) {}
      }

      function addRecentSearch(place) {
        if (!place || !place.name) return;
        try {
          let recents = JSON.parse(localStorage.getItem('smartWeatherRecents') || '[]');
          recents = recents.filter(r => r.name !== place.name && r.latitude !== place.latitude);
          recents.unshift({
            name: place.name,
            admin1: place.admin1 || '',
            country_code: place.country_code || '',
            latitude: place.latitude,
            longitude: place.longitude
          });
          recents = recents.slice(0, 5);
          localStorage.setItem('smartWeatherRecents', JSON.stringify(recents));
          renderRecentChips();
        } catch (e) {}
      }

      function renderRecentChips() {
        try {
          const recents = JSON.parse(localStorage.getItem('smartWeatherRecents') || '[]');
          if (!recents.length) {
            recentSearchWrap.classList.add('hidden');
            return;
          }
          recentSearchWrap.classList.remove('hidden');
          recentChips.innerHTML = recents.map(r => `
            <button type="button" class="recent-chip px-2 py-0.5 rounded bg-slate-200/80 hover:bg-sky-200 text-slate-700 transition cursor-pointer font-medium"
              data-json='${JSON.stringify(r).replace(/'/g, "&apos;")}'>
              ${escapeHtml(r.name)}
            </button>
          `).join('');

          recentChips.querySelectorAll('.recent-chip').forEach(btn => {
            btn.addEventListener('click', () => {
              const place = JSON.parse(btn.getAttribute('data-json'));
              cityInput.value = place.name;
              if (place.country_code) countryInput.value = place.country_code;
              fetchForecastForCoords(place);
            });
          });
        } catch (e) {}
      }

      function bindEvents() {
        btnSearch.addEventListener('click', () => {
          const city = cityInput.value.trim();
          if (!city) {
            showStatus('都市名を入力してください。', 'error');
            return;
          }
          fetchForecastForCity(city, countryInput.value.trim());
        });

        cityInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            autocompleteDropdown.classList.add('hidden');
            btnSearch.click();
          }
        });

        cityInput.addEventListener('input', () => {
          const query = cityInput.value.trim();
          btnClearCity.classList.toggle('hidden', !query);
          clearTimeout(debounceTimer);
          if (query.length < 1) {
            autocompleteDropdown.classList.add('hidden');
            return;
          }
          debounceTimer = setTimeout(() => {
            fetchGeocodingSuggestions(query);
          }, 200);
        });

        btnClearCity.addEventListener('click', () => {
          cityInput.value = '';
          btnClearCity.classList.add('hidden');
          autocompleteDropdown.classList.add('hidden');
          cityInput.focus();
        });

        document.addEventListener('click', (e) => {
          if (!autocompleteDropdown.contains(e.target) && e.target !== cityInput) {
            autocompleteDropdown.classList.add('hidden');
          }
        });

        btnGeoLocation.addEventListener('click', getCurrentGeoLocation);

        btnRefresh.addEventListener('click', () => {
          if (currentPlace) {
            fetchForecastForCoords(currentPlace);
          } else {
            btnSearch.click();
          }
        });

        document.querySelectorAll('.quick-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            const cityName = chip.getAttribute('data-city');
            const countryCode = chip.getAttribute('data-country');
            cityInput.value = cityName;
            countryInput.value = countryCode;
            btnClearCity.classList.remove('hidden');
            fetchForecastForCity(cityName, countryCode);
          });
        });

        compactModeEl.addEventListener('change', () => {
          savePreferences();
          if (currentForecastData && currentPlace) {
            renderFullWeather(currentForecastData, currentPlace);
          }
        });

        windUnitKmhEl.addEventListener('change', () => {
          savePreferences();
          if (currentForecastData && currentPlace) {
            renderFullWeather(currentForecastData, currentPlace);
          }
        });

        weeksSelect.addEventListener('change', () => {
          savePreferences();
          if (currentPlace) {
            fetchForecastForCoords(currentPlace);
          }
        });

        shareButton.addEventListener('click', handleShare);
      }

      function showStatus(message, type = 'info') {
        if (!message) {
          statusBar.classList.add('hidden');
          return;
        }
        statusBar.classList.remove('hidden', 'bg-rose-100', 'text-rose-800', 'bg-emerald-100', 'text-emerald-800', 'bg-sky-100', 'text-sky-800');
        if (type === 'error') {
          statusBar.classList.add('bg-rose-100', 'text-rose-800');
          statusBar.innerHTML = `⚠️ ${escapeHtml(message)}`;
        } else if (type === 'success') {
          statusBar.classList.add('bg-emerald-100', 'text-emerald-800');
          statusBar.innerHTML = `✅ ${escapeHtml(message)}`;
        } else {
          statusBar.classList.add('bg-sky-100', 'text-sky-800');
          statusBar.innerHTML = `ℹ️ ${escapeHtml(message)}`;
        }
      }

      function getCurrentGeoLocation() {
        if (!navigator.geolocation) {
          showStatus('お使いのブラウザは位置情報サービスに対応していません。', 'error');
          return;
        }
        showStatus('現在地（GPS）を取得中...', 'info');
        btnGeoLocation.classList.add('animate-pulse');

        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            btnGeoLocation.classList.remove('animate-pulse');
            const { latitude, longitude } = pos.coords;
            showStatus('現在地周辺の天気を取得中...', 'info');

            let placeName = '現在地';
            try {
              const revUrl = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=ja`;
              const res = await fetch(revUrl);
              if (res.ok) {
                const geo = await res.json();
                placeName = geo.city || geo.locality || geo.principalSubdivision || '現在地';
                cityInput.value = placeName;
                if (geo.countryCode) countryInput.value = geo.countryCode;
              }
            } catch (e) {
              cityInput.value = `現在地 (${latitude.toFixed(2)}, ${longitude.toFixed(2)})`;
            }

            const place = {
              name: placeName,
              latitude,
              longitude,
              country_code: countryInput.value || 'JP',
              admin1: ''
            };
            fetchForecastForCoords(place);
          },
          (err) => {
            btnGeoLocation.classList.remove('animate-pulse');
            let msg = '現在地の取得に失敗しました。';
            if (err.code === 1) msg = '位置情報の利用が許可されていません。ブラウザ設定をご確認ください。';
            else if (err.code === 2) msg = '位置情報を特定できませんでした。';
            showStatus(msg, 'error');
          },
          { timeout: 10000, enableHighAccuracy: true }
        );
      }

      // リアルタイム候補検索（内蔵日本辞書 ＋ Open-Meteo Geocoding API）
      async function fetchGeocodingSuggestions(query) {
        geocodingSpinner.classList.remove('hidden');

        // まず内蔵辞書から候補を抽出
        const localHits = findInLocalDict(query);
        let results = [...localHits];

        try {
          // Open-Meteo APIにも問い合わせ（ローマ字または英語名で補強）
          const apiQuery = localHits.length && localHits[0].en ? localHits[0].en : query;
          const url = new URL('https://geocoding-api.open-meteo.com/v1/search');
          url.searchParams.set('name', apiQuery);
          const country = countryInput.value.trim().toUpperCase();
          if (country) url.searchParams.set('country', country);
          url.searchParams.set('count', '5');
          url.searchParams.set('format', 'json');

          const res = await fetch(url.toString());
          if (res.ok) {
            const data = await res.json();
            if (data.results && data.results.length) {
              for (const r of data.results) {
                if (!results.some(x => Math.abs(x.latitude - r.latitude) < 0.05 && Math.abs(x.longitude - r.longitude) < 0.05)) {
                  results.push({
                    name: r.name,
                    latitude: r.latitude,
                    longitude: r.longitude,
                    country_code: r.country_code || '',
                    admin1: r.admin1 || ''
                  });
                }
              }
            }
          }
        } catch (e) {}

        geocodingSpinner.classList.add('hidden');

        if (!results.length) {
          autocompleteDropdown.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">該当する候補が見つかりません</div>';
          autocompleteDropdown.classList.remove('hidden');
          return;
        }

        autocompleteDropdown.innerHTML = results.slice(0, 8).map((item, idx) => {
          const sub = [item.admin1, item.country_code].filter(Boolean).join(', ');
          return `
            <div class="autocomplete-item p-2.5 hover:bg-sky-50 cursor-pointer flex items-center justify-between transition" data-index="${idx}">
              <div>
                <div class="text-sm font-semibold text-slate-800">${escapeHtml(item.name)}</div>
                <div class="text-[11px] text-slate-500">${escapeHtml(sub)} &bull; 緯度 ${item.latitude.toFixed(2)} / 経度 ${item.longitude.toFixed(2)}</div>
              </div>
              <span class="text-xs text-sky-600 font-medium">選択 ➔</span>
            </div>
          `;
        }).join('');

        autocompleteDropdown.classList.remove('hidden');

        autocompleteDropdown.querySelectorAll('.autocomplete-item').forEach(el => {
          el.addEventListener('click', () => {
            const idx = parseInt(el.getAttribute('data-index'), 10);
            const selected = results[idx];
            cityInput.value = selected.name;
            if (selected.country_code) countryInput.value = selected.country_code;
            autocompleteDropdown.classList.add('hidden');
            fetchForecastForCoords(selected);
          });
        });
      }

      // 都市名から検索
      async function fetchForecastForCity(cityName, countryCode) {
        showStatus(`${cityName} の位置情報を検索中...`, 'info');
        weatherContent.innerHTML = renderSkeleton();

        // 1. 内蔵日本都市辞書から検索
        const localHits = findInLocalDict(cityName);
        if (localHits.length > 0) {
          fetchForecastForCoords(localHits[0]);
          return;
        }

        // 2. Open-Meteo Geocoding APIに問い合わせ
        try {
          const geoUrl = new URL('https://geocoding-api.open-meteo.com/v1/search');
          geoUrl.searchParams.set('name', cityName);
          if (countryCode) geoUrl.searchParams.set('country', countryCode.toUpperCase());
          geoUrl.searchParams.set('count', '5');
          geoUrl.searchParams.set('format', 'json');

          const res = await fetch(geoUrl.toString());
          if (!res.ok) throw new Error('地名検索APIに接続できませんでした');
          const data = await res.json();

          if (!data.results || !data.results.length) {
            showStatus(`「${cityName}」が見つかりませんでした。別の表記（例: Tokyo, Osaka）をお試しください。`, 'error');
            weatherContent.innerHTML = renderEmptyState('該当する都市が見つかりませんでした');
            return;
          }

          const place = data.results[0];
          fetchForecastForCoords(place);
        } catch (err) {
          console.error(err);
          showStatus('通信エラーが発生しました。インターネット接続をご確認ください。', 'error');
          weatherContent.innerHTML = renderEmptyState('データの取得に失敗しました');
        }
      }

      // 座標からOpen-Meteoの総合予報データ（Hourly + Daily）を取得
      async function fetchForecastForCoords(place) {
        currentPlace = place;
        savePreferences();
        addRecentSearch(place);

        const weeks = parseInt(weeksSelect.value, 10);
        const forecastDays = Math.min(weeks * 7, 16);

        showStatus(`${place.name} の最新気象データを取得中...`, 'info');

        try {
          const url = new URL('https://api.open-meteo.com/v1/forecast');
          url.searchParams.set('latitude', place.latitude);
          url.searchParams.set('longitude', place.longitude);

          url.searchParams.set(
            'daily',
            'weathercode,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,precipitation_sum,sunrise,sunset,uv_index_max,windspeed_10m_max,windspeed_10m_min,winddirection_10m_dominant'
          );

          url.searchParams.set(
            'hourly',
            'temperature_2m,apparent_temperature,precipitation_probability,precipitation,weathercode,surface_pressure,windspeed_10m,winddirection_10m,relative_humidity_2m'
          );

          url.searchParams.set(
            'current',
            'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weathercode,surface_pressure,windspeed_10m,winddirection_10m'
          );

          url.searchParams.set('forecast_days', String(forecastDays));
          url.searchParams.set('timezone', 'auto');

          const res = await fetch(url.toString());
          if (!res.ok) throw new Error('天気予報APIの呼び出しに失敗しました');
          const data = await res.json();

          currentForecastData = data;
          showStatus(`${place.name} の気象情報を更新しました（${new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}）`, 'success');

          updateAmbientTheme(data);
          renderFullWeather(data, place);
          buildShareSummary(data, place);
        } catch (err) {
          console.error(err);
          showStatus('天気データの取得に失敗しました。時間をおいて再試行してください。', 'error');
          weatherContent.innerHTML = renderEmptyState('天気データを取得できませんでした');
        }
      }

      function updateAmbientTheme(data) {
        if (!data || !data.current) return;
        const code = data.current.weathercode;
        const isDay = data.current.is_day !== 0;

        let bgClass = 'bg-slate-900';
        let grad = 'bg-gradient-to-br from-sky-500/20 via-indigo-500/20 to-slate-900/40';

        if (code === 0 || code === 1) {
          if (isDay) {
            bgClass = 'bg-slate-900';
            grad = 'bg-gradient-to-br from-amber-400/25 via-sky-400/20 to-blue-700/30';
          } else {
            bgClass = 'bg-slate-950';
            grad = 'bg-gradient-to-br from-indigo-900/40 via-purple-900/30 to-slate-950';
          }
        } else if ([61, 63, 65, 80, 81, 82].includes(code)) {
          bgClass = 'bg-slate-900';
          grad = 'bg-gradient-to-br from-cyan-600/25 via-blue-700/25 to-slate-900/50';
        } else if ([71, 73, 75, 85, 86].includes(code)) {
          bgClass = 'bg-slate-900';
          grad = 'bg-gradient-to-br from-sky-200/30 via-indigo-200/20 to-slate-900/40';
        } else if ([95, 96, 99].includes(code)) {
          bgClass = 'bg-slate-950';
          grad = 'bg-gradient-to-br from-purple-700/35 via-rose-900/25 to-slate-950';
        }

        bodyBg.className = `min-h-screen ${bgClass} text-slate-800 antialiased relative overflow-x-hidden font-sans transition-colors duration-1000`;
        ambientGradient.className = `absolute inset-0 ${grad} transition-all duration-1000`;
      }

        86: { desc: '強いにわか雪', icon: '🌨️' },
        95: { desc: '雷雨', icon: '⛈️' },
        96: { desc: '雷雨 (雹伴う)', icon: '⛈️' },
        99: { desc: '激しい雷雨', icon: '⚡' }
      };

      function getWeatherInfo(code) {
        return WEATHER_MAP[code] || { desc: '不明', icon: '❓' };
      }

      function formatWindSpeed(val, isKmh) {
        if (typeof val !== 'number') return '-';
        return isKmh ? (val * 3.6).toFixed(1) : val.toFixed(1);
      }

      function getWindArrow(deg) {
        if (typeof deg !== 'number') return '•';
        const arrows = ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'];
        const idx = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
        return arrows[idx];
      }

      function getWindDirName(deg) {
        if (typeof deg !== 'number') return '不明';
        const dirs = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
        const idx = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
        return dirs[idx];
      }

      function analyzePressureAlert(hourly) {
        if (!hourly || !hourly.surface_pressure || !hourly.time) {
          return { level: 'normal', badge: '✅ 安定', text: '気圧データなし', delta: 0, desc: '平常な気圧です', color: 'border-slate-200 bg-white/70 text-slate-700' };
        }
        const now = new Date();
        const nowIsoPrefix = now.toISOString().slice(0, 13);
        let curIdx = hourly.time.findIndex(t => t.startsWith(nowIsoPrefix));
        if (curIdx === -1) curIdx = 0;

        const curPres = hourly.surface_pressure[curIdx];
        const next12Idx = Math.min(curIdx + 12, hourly.surface_pressure.length - 1);
        const futurePres = hourly.surface_pressure[next12Idx];
        const delta = futurePres - curPres;

        if (delta <= -5.0) {
          return {
            level: 'danger',
            badge: '⚡ 警戒：急降下',
            text: `12時間で ${Math.abs(delta).toFixed(1)} hPa 低下`,
            desc: '頭痛・天気痛やだるさを感じやすい急激な気圧降下です。無理をせず休息・水分補給を。',
            color: 'border-rose-300 bg-rose-50 text-rose-800'
          };
        } else if (delta <= -2.5) {
          return {
            level: 'warning',
            badge: '⚠️ 注意：低下傾向',
            text: `12時間で ${Math.abs(delta).toFixed(1)} hPa 低下`,
            desc: '気圧がやや低下します。気象病・偏頭痛持ちの方は早めの対策をおすすめします。',
            color: 'border-amber-300 bg-amber-50 text-amber-800'
          };
        } else if (delta >= 4.0) {
          return {
            level: 'up',
            badge: '↗ 気圧上昇中',
            text: `12時間で +${delta.toFixed(1)} hPa 上昇`,
            desc: '天気が回復に向かい、気圧が急上昇しています。自律神経の乱れにご注意ください。',
            color: 'border-sky-300 bg-sky-50 text-sky-800'
          };
        } else {
          return {
            level: 'stable',
            badge: '✅ 安定',
            text: `${curPres ? curPres.toFixed(0) : 1013} hPa (変動わずか)`,
            desc: '気圧は比較的安定しており、天気痛のリスクは低めです。',
            color: 'border-emerald-300 bg-emerald-50 text-emerald-800'
          };
        }
      }

      function calculateLifestyleIndices(tMax, tMin, weatherCode, windMax, uvMax, popMax) {
        const avg = (tMax + tMin) / 2;
        const isRain = [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(weatherCode);
        const isSnow = [71,73,75,77,85,86].includes(weatherCode);

        let cloth = { title: '服装', score: '快適', icon: '👕', desc: '長袖シャツやカーディガン' };
        if (tMax >= 32) cloth = { title: '服装', score: '猛暑', icon: '🎽', desc: '半袖・ノースリーブ＋熱中症対策' };
        else if (tMax >= 26) cloth = { title: '服装', score: '夏服', icon: '👕', desc: '半袖や通気性の良い服' };
        else if (avg >= 20) cloth = { title: '服装', score: '適温', icon: '👔', desc: '長袖シャツ＋羽織りもの' };
        else if (avg >= 15) cloth = { title: '服装', score: 'やや肌寒い', icon: '🧥', desc: 'ジャケットや薄手セーター' };
        else if (avg >= 8) cloth = { title: '服装', score: '寒い', icon: '🧥', desc: '冬用コート・セーター' };
        else cloth = { title: '服装', score: '極寒', icon: '🧤', desc: 'ダウンコート＋マフラー・手袋' };

        let umbrella = { title: '傘', score: '不要', icon: '☀️', desc: '傘の心配はありません' };
        if (isRain || (popMax != null && popMax >= 70)) {
          umbrella = { title: '傘', score: '長傘必須', icon: '☔', desc: 'しっかりとした雨具が必要です' };
        } else if ((popMax != null && popMax >= 40) || [80, 81].includes(weatherCode)) {
          umbrella = { title: '傘', score: '折りたたみ推奨', icon: '🌂', desc: '急な雨に備えて折りたたみ傘を' };
        } else if (isSnow) {
          umbrella = { title: '傘', score: '雪対策', icon: '🌂', desc: '傘またはフード付き防寒着' };
        }

        let laundry = { title: '洗濯', score: '最適', icon: '🧺', desc: '外干しでカラッと乾きます' };
        if (isRain || isSnow) {
          laundry = { title: '洗濯', score: '部屋干し', icon: '🚫', desc: '雨・雪のため室内干し推奨' };
        } else if (popMax != null && popMax >= 50) {
          laundry = { title: '洗濯', score: '部屋干し推奨', icon: '⚠️', desc: '急な天気の崩れに注意' };
        } else if (avg < 12 || (windMax != null && windMax > 12)) {
          laundry = { title: '洗濯', score: '乾きにくい', icon: '🙂', desc: '気温が低めまたは風が強め' };
        }

        let golf = { title: 'ゴルフ', score: '最高', icon: '⛳', desc: '絶好のプレー日和です' };
        if (isRain || isSnow) {
          golf = { title: 'ゴルフ', score: '不向き', icon: '🚫', desc: '雨・雪のためプレーは慎重に' };
        } else if (windMax != null && windMax >= 10) {
          golf = { title: 'ゴルフ', score: '強風注意', icon: '🌬️', desc: '風の影響を受けやすいコンディション' };
        } else if (tMax >= 33) {
          golf = { title: 'ゴルフ', score: '熱中症警戒', icon: '🥵', desc: '激しい暑さに厳重警戒' };
        } else if (avg < 8) {
          golf = { title: 'ゴルフ', score: '防寒必須', icon: '🏌️', desc: '朝晩の冷え込みに十分な防寒を' };
        }

        let run = { title: 'ランニング', score: '快適', icon: '🏃', desc: '爽やかに走れる気候です' };
        if (isRain) run = { title: 'ランニング', score: 'スリップ注意', icon: '🌧️', desc: '足元が滑りやすく室内運動推奨' };
        else if (tMax >= 30) run = { title: 'ランニング', score: '早朝・夜間推奨', icon: '💦', desc: '日中の運動は避け涼しい時間に' };
        else if (tMin <= 2) run = { title: 'ランニング', score: 'ウォーミングアップを入念に', icon: '🥶', desc: '筋肉の冷えや路面凍結に注意' };

        let uv = { title: '紫外線 (UV)', score: '普通', icon: '🧴', desc: '一般的な紫外線対策を' };
        const uvVal = uvMax || 0;
        if (uvVal >= 8) uv = { title: '紫外線 (UV)', score: '極めて強い', icon: '🕶️', desc: '日傘・サングラス・日焼け止め必須' };
        else if (uvVal >= 6) uv = { title: '紫外線 (UV)', score: '強い', icon: '☀️', desc: '日焼け止めをしっかり塗布' };
        else if (uvVal < 3) uv = { title: '紫外線 (UV)', score: '弱い', icon: '✨', desc: '紫外線ダメージは少なめ' };

        return [cloth, umbrella, laundry, golf, run, uv];
      }

      function renderHourlyCards(hourly, isKmh) {
        if (!hourly || !hourly.time || !hourly.time.length) {
          return '<p class="text-xs text-slate-400">時間別データがありません</p>';
        }
        const now = new Date();
        const nowIsoPrefix = now.toISOString().slice(0, 13);
        let startIdx = hourly.time.findIndex(t => t.startsWith(nowIsoPrefix));
        if (startIdx === -1) startIdx = 0;

        const endIdx = Math.min(startIdx + 30, hourly.time.length);
        let cardsHtml = '';

        for (let i = startIdx; i < endIdx; i++) {
          const tIso = hourly.time[i];
          const d = new Date(tIso);
          const hourLabel = i === startIdx ? '現在' : `${d.getHours()}:00`;
          const code = hourly.weathercode[i];
          const info = getWeatherInfo(code);
          const temp = hourly.temperature_2m[i];
          const pop = hourly.precipitation_probability ? hourly.precipitation_probability[i] : null;
          const pSum = hourly.precipitation ? hourly.precipitation[i] : 0;
          const wind = hourly.windspeed_10m ? hourly.windspeed_10m[i] : 0;
          const windDir = hourly.winddirection_10m ? hourly.winddirection_10m[i] : 0;
          const isCurrent = (i === startIdx);

          cardsHtml += `
            <div class="flex-shrink-0 w-24 p-3 rounded-2xl text-center glass-card ${isCurrent ? 'ring-2 ring-sky-500 bg-sky-50/80' : 'bg-white/80'} border border-slate-200/80">
              <div class="text-[11px] font-bold ${isCurrent ? 'text-sky-600' : 'text-slate-600'}">${escapeHtml(hourLabel)}</div>
              <div class="text-2xl my-1.5 filter drop-shadow-xs" title="${info.desc}">${info.icon}</div>
              <div class="text-sm font-extrabold text-slate-900 font-display">${temp ? temp.toFixed(0) : '-'}°</div>
              <div class="mt-1.5 flex flex-col gap-0.5 text-[10px]">
                <span class="font-semibold ${pop != null && pop >= 40 ? 'text-blue-600 font-bold' : 'text-slate-500'}">
                  💧 ${pop != null ? Math.round(pop) + '%' : '-'}
                </span>
                ${pSum > 0 ? `<span class="text-blue-500 font-medium">${pSum.toFixed(1)}mm</span>` : ''}
                <span class="text-slate-400 mt-0.5 flex items-center justify-center gap-0.5">
                  <span>${getWindArrow(windDir)}</span>
                  <span>${formatWindSpeed(wind, isKmh)}</span>
                </span>
              </div>
            </div>
          `;
        }
        return cardsHtml;
      }

      function renderWeeklyCards(daily, isKmh, compact) {

          const start = w * 7;
          const end = Math.min(start + 7, total);
          const weekStartDate = formatDateJp(daily.time[start]);
          const weekEndDate = formatDateJp(daily.time[end - 1]);

          html += `
            <div class="glass-panel rounded-2xl overflow-hidden shadow-sm border border-white/60">
              <div class="px-4 py-3 bg-slate-100/80 border-b border-slate-200/60 flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-extrabold text-sky-700 uppercase tracking-wider px-2 py-0.5 rounded-md bg-sky-100">
                    第 ${w + 1} 週
                  </span>
                  <span class="text-xs text-slate-500 font-medium">${escapeHtml(weekStartDate)} 〜 ${escapeHtml(weekEndDate)}</span>
                </div>
                <span class="text-[11px] text-slate-500">${end - start}日間</span>
              </div>
              <div class="divide-y divide-slate-100">
          `;

          for (let i = start; i < end; i++) {
            const dateStr = daily.time[i];
            const { dayLabel, weekday, isWeekend } = getDayDetails(dateStr);
            const code = daily.weathercode[i];
            const info = getWeatherInfo(code);
            const tMax = daily.temperature_2m_max[i];
            const tMin = daily.temperature_2m_min[i];
            const popMax = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
            const pSum = daily.precipitation_sum ? daily.precipitation_sum[i] : null;
            const windMax = daily.windspeed_10m_max ? daily.windspeed_10m_max[i] : null;
            const windDir = daily.winddirection_10m_dominant ? daily.winddirection_10m_dominant[i] : null;
            const uvMax = daily.uv_index_max ? daily.uv_index_max[i] : null;
            const sr = daily.sunrise ? daily.sunrise[i] : null;
            const ss = daily.sunset ? daily.sunset[i] : null;
            const isToday = i === 0;

            html += `
              <div class="p-3.5 sm:p-4 hover:bg-slate-50/80 transition ${isToday ? 'bg-sky-50/50' : 'bg-white/60'}">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                  <div class="flex items-center gap-3.5">
                    <div class="w-16 flex-shrink-0">
                      <div class="text-sm font-bold text-slate-900">${dayLabel}</div>
                      <div class="text-xs font-semibold ${isWeekend === 'sun' ? 'text-rose-600' : (isWeekend === 'sat' ? 'text-sky-600' : 'text-slate-500')}">
                        ${weekday}
                        ${isToday ? '<span class="ml-1 px-1.5 py-0.2 rounded bg-sky-600 text-white text-[10px]">今日</span>' : ''}
                      </div>
                    </div>
                    <div class="text-3xl filter drop-shadow-xs" title="${info.desc}">
                      ${info.icon}
                    </div>
                    <div>
                      <div class="text-sm font-bold text-slate-800">${info.desc}</div>
                      ${popMax != null ? `<div class="text-xs font-medium ${popMax >= 40 ? 'text-blue-600 font-bold' : 'text-slate-500'}">降水確率: ${Math.round(popMax)}%</div>` : ''}
                    </div>
                  </div>

                  <div class="flex items-center gap-4 sm:gap-6 text-xs text-slate-700">
                    <div class="text-right">
                      <div class="font-extrabold text-sm text-slate-900 font-display">
                        <span class="text-rose-600">${tMax ? tMax.toFixed(0) : '-'}°</span> / <span class="text-sky-600">${tMin ? tMin.toFixed(0) : '-'}°</span>
                      </div>
                      <div class="text-[11px] text-slate-500">寒暖差 ${(tMax - tMin).toFixed(0)}℃</div>
                    </div>

                    <div class="w-24 text-right hidden sm:block">
                      <div>${pSum != null && pSum > 0 ? `<strong class="text-blue-600">${pSum.toFixed(1)} mm</strong>` : '<span class="text-slate-400">-</span>'}</div>
                      <div class="text-[11px] text-slate-500">降水量</div>
                    </div>

                    <div class="w-28 text-right hidden md:block">
                      <div class="font-semibold">${formatWindSpeed(windMax, isKmh)} ${speedUnit}</div>
                      <div class="text-[11px] text-slate-500">${getWindDirName(windDir)} ${getWindArrow(windDir)}</div>
                    </div>
                  </div>
                </div>

                ${!compact ? `
                  <div class="mt-2.5 pt-2 border-t border-slate-100 flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-slate-500">
                    ${sr && ss ? `<span>🌅 日の出 ${formatTimeShort(sr)} / 日の入 ${formatTimeShort(ss)}</span>` : ''}
                    ${uvMax != null ? `<span>☀️ UV最大 ${uvMax.toFixed(1)}</span>` : ''}
                    <span>👔 ${escapeHtml(clothingAdviceShort(tMax, tMin))}</span>
                    <span>☔ ${escapeHtml(umbrellaAdviceShort(code, popMax))}</span>
                  </div>
                ` : ''}
              </div>
            `;
          }

          html += `
              </div>
            </div>
          `;
        }

        return html;
      }

      function drawWeatherChart(daily) {
        const canvas = document.getElementById('weatherCanvas');
        if (!canvas || !daily || !daily.time) return;

        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;
        ctx.clearRect(0, 0, width, height);

        const days = Math.min(daily.time.length, 14);
        const tMaxArr = daily.temperature_2m_max.slice(0, days);
        const tMinArr = daily.temperature_2m_min.slice(0, days);
        const pSumArr = daily.precipitation_sum ? daily.precipitation_sum.slice(0, days) : [];

        const maxTemp = Math.ceil(Math.max(...tMaxArr, 10) + 3);
        const minTemp = Math.floor(Math.min(...tMinArr, 0) - 2);
        const tempRange = (maxTemp - minTemp) || 1;

        const padLeft = 35;
        const padRight = 20;
        const padTop = 30;
        const padBottom = 35;
        const chartW = width - padLeft - padRight;
        const chartH = height - padTop - padBottom;

        const stepX = chartW / (days - 1);

        const maxPrecip = Math.max(...pSumArr, 10);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
        for (let i = 0; i < days; i++) {
          const val = pSumArr[i] || 0;
          if (val > 0) {
            const barH = (val / maxPrecip) * (chartH * 0.4);
            const x = padLeft + i * stepX - 10;
            const y = padTop + chartH - barH;
            ctx.fillRect(x, y, 20, barH);
          }
        }

        ctx.strokeStyle = 'rgba(203, 213, 225, 0.4)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        for (let t = Math.ceil(minTemp / 5) * 5; t <= maxTemp; t += 5) {
          const y = padTop + chartH - ((t - minTemp) / tempRange) * chartH;
          ctx.beginPath();
          ctx.moveTo(padLeft, y);
          ctx.lineTo(width - padRight, y);
          ctx.stroke();

          ctx.fillStyle = '#94a3b8';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(`${t}°`, padLeft - 6, y + 3);
        }
        ctx.setLineDash([]);

        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        for (let i = 0; i < days; i++) {
          const x = padLeft + i * stepX;
          const y = padTop + chartH - ((tMaxArr[i] - minTemp) / tempRange) * chartH;
          if (i === 0) ctx.moveTo(x, y);
          else {
            const prevX = padLeft + (i - 1) * stepX;
            const prevY = padTop + chartH - ((tMaxArr[i - 1] - minTemp) / tempRange) * chartH;
            const cpX = (prevX + x) / 2;
            ctx.bezierCurveTo(cpX, prevY, cpX, y, x, y);
          }
        }
        ctx.stroke();

        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        for (let i = 0; i < days; i++) {
          const x = padLeft + i * stepX;
          const y = padTop + chartH - ((tMinArr[i] - minTemp) / tempRange) * chartH;
          if (i === 0) ctx.moveTo(x, y);
          else {
            const prevX = padLeft + (i - 1) * stepX;
            const prevY = padTop + chartH - ((tMinArr[i - 1] - minTemp) / tempRange) * chartH;
            const cpX = (prevX + x) / 2;
            ctx.bezierCurveTo(cpX, prevY, cpX, y, x, y);
          }
        }
        ctx.stroke();

        for (let i = 0; i < days; i++) {
          const x = padLeft + i * stepX;
          const yMax = padTop + chartH - ((tMaxArr[i] - minTemp) / tempRange) * chartH;
          const yMin = padTop + chartH - ((tMinArr[i] - minTemp) / tempRange) * chartH;

          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#f43f5e';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, yMax, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#0284c7';
          ctx.beginPath();
          ctx.arc(x, yMin, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          const dObj = new Date(daily.time[i] + 'T00:00:00');
          const dLabel = `${dObj.getMonth() + 1}/${dObj.getDate()}`;
          ctx.fillStyle = '#475569';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(dLabel, x, height - 12);
        }
      }

      function getDayDetails(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        const weekdayNames = ['日', '月', '火', '水', '木', '金', '土'];
        const dayOfWeek = d.getDay();
        const weekday = weekdayNames[dayOfWeek] + '曜';
        const dayLabel = `${d.getMonth() + 1}/${d.getDate()}`;
        const isWeekend = dayOfWeek === 0 ? 'sun' : (dayOfWeek === 6 ? 'sat' : false);
        return { dayLabel, weekday, isWeekend };
      }

      function formatDateJp(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
      }

      function formatTimeShort(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        if (Number.isNaN(d.getTime())) return isoStr;
        return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
      }

      function clothingAdviceShort(tMax, tMin) {
        const avg = (tMax + tMin) / 2;
        if (avg >= 26) return '半袖・軽装が快適';
        if (avg >= 20) return '薄手の長袖や羽織り';
        if (avg >= 14) return 'ジャケット推奨';
        if (avg >= 8) return '冬コート着用';
        return '厳重防寒・手袋推奨';
      }

      function umbrellaAdviceShort(code, pop) {
        if ([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code) || (pop != null && pop >= 60)) {
          return '傘必須';
        }
        if (pop != null && pop >= 30) return '折りたたみ傘があると安心';
        return '傘不要';
      }

      function buildShareSummary(data, place) {
        try {
          const lines = [];
          const placeName = [place.name, place.admin1, place.country_code].filter(Boolean).join(' / ');
          lines.push(`【SmartWeather Pro】${placeName}の天気予報`);

          const current = data.current || {};
          const daily = data.daily || {};
          const hourly = data.hourly || {};

          if (current.temperature_2m != null) {
            const info = getWeatherInfo(current.weathercode);
            lines.push(`現在: ${info.desc} ${current.temperature_2m.toFixed(1)}℃ (体感 ${current.apparent_temperature?.toFixed(0) || '-'}℃)`);
          }

          const alert = analyzePressureAlert(hourly);
          lines.push(`気圧状況: ${alert.badge} (${alert.text})`);

          if (daily.time && daily.time.length) {
            lines.push('--- 今後3日間の見通し ---');
            for (let i = 0; i < Math.min(daily.time.length, 3); i++) {
              const { dayLabel, weekday } = getDayDetails(daily.time[i]);
              const info = getWeatherInfo(daily.weathercode[i]);
              const tMax = daily.temperature_2m_max[i];
              const tMin = daily.temperature_2m_min[i];
              const pop = daily.precipitation_probability_max ? Math.round(daily.precipitation_probability_max[i]) : null;
              const popStr = pop != null ? ` 降水${pop}%` : '';
              lines.push(`${dayLabel}(${weekday.replace('曜','')}): ${info.desc} ${tMax.toFixed(0)}/${tMin.toFixed(0)}℃${popStr}`);
            }
          }
          lines.push('\nWebで詳細・24h予報を確認:');
          lines.push(window.location.href);

          lastShareText = lines.join('\n');
        } catch (e) {
          lastShareText = '';
        }
      }

      async function handleShare() {
        if (!lastShareText) {
          showToast('共有する天気情報がありません。');
          return;
        }

        if (navigator.share) {
          try {
            await navigator.share({
              title: document.title,
              text: lastShareText,
              url: window.location.href
            });
            showToast('共有が完了しました');
            return;
          } catch (e) {}
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(lastShareText);
            showToast('📋 予報サマリーをコピーしました！LINE等に貼付できます');
            return;
          } catch (e) {}
        }

        showToast('手動でテキストをコピーしてください');
      }

      function showToast(msg) {
        shareToast.textContent = msg;
        shareToast.classList.remove('hidden');
        shareToast.classList.add('opacity-100');
        setTimeout(() => {
          shareToast.classList.add('hidden');
        }, 4000);
      }

      function renderSkeleton() {
        return `
          <div class="glass-panel rounded-3xl p-7 shadow-xl animate-pulse space-y-4">
            <div class="h-6 bg-slate-200 rounded-lg w-1/3"></div>
            <div class="h-16 bg-slate-200 rounded-2xl w-2/3"></div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-4">
              <div class="h-20 bg-slate-200 rounded-xl"></div>
              <div class="h-20 bg-slate-200 rounded-xl"></div>
              <div class="h-20 bg-slate-200 rounded-xl"></div>
              <div class="h-20 bg-slate-200 rounded-xl"></div>
            </div>
          </div>
        `;
      }

      function renderEmptyState(title) {
        return `
          <div class="glass-panel rounded-2xl p-10 text-center text-slate-500">
            <div class="text-4xl mb-2">🔍</div>
            <h3 class="text-sm font-bold text-slate-700">${escapeHtml(title)}</h3>
            <p class="text-xs text-slate-400 mt-1">都市名や国コードを見直して再度お試しください。</p>
          </div>
        `;
      }

      function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      initApp();
    })();
  </script>
