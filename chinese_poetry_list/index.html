<style>
:root{--ink:#121212;--ink2:#1a1817;--paper:#e9dfc6;--paper2:#d8ccaa;--red:#c93a2b;--gold:#c5a059;--tx:#e8e0cc}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(ellipse at top,#1a1817,#121212 70%);color:var(--tx);font-family:'Shippori Mincho','Noto Serif JP',serif;min-height:100%}
body{padding:0 0 40px}
h1,h2,h3{font-weight:800;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
header{padding:22px 0 10px;text-align:center;border-bottom:1px solid #3a342c}
header h1{font-size:clamp(1.5rem,5vw,2.4rem);letter-spacing:.12em;color:var(--gold)}
header p{margin:6px 0 0;font-size:.85rem;color:#a89c82;letter-spacing:.2em}
.seal{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#f6e7d8;font-weight:800;border-radius:3px;padding:3px;writing-mode:vertical-rl;letter-spacing:.1em;font-size:.8rem;line-height:1.1;box-shadow:inset 0 0 0 2px #f6e7d855;transform:rotate(-3deg);vertical-align:middle}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.tab{background:#1f1c19;border:1px solid #3a342c;color:#cbbf9f;padding:9px 14px;border-radius:4px;cursor:pointer;font:inherit;font-weight:600}
.tab.on{background:var(--red);color:#fff;border-color:var(--red)}
.sec{display:none}.sec.on{display:block}
.btn{background:#2a2521;border:1px solid var(--gold);color:var(--gold);padding:7px 13px;border-radius:4px;cursor:pointer;font:inherit}
.btn:hover{background:var(--gold);color:#121212}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
input,select,textarea{background:#14120f;border:1px solid #4a4238;color:var(--tx);padding:8px;border-radius:4px;font:inherit;max-width:100%}
textarea{width:100%;min-height:90px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chip{display:inline-block;border:1px solid #5a4e3c;border-radius:99px;padding:2px 10px;margin:2px;font-size:.85rem;cursor:pointer;color:var(--gold);background:#1c1916}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;background:linear-gradient(160deg,#eadfc4,#d6c9a6);color:#2a2118;border-radius:6px;padding:14px;cursor:pointer;min-height:250px;box-shadow:0 6px 18px #0008;overflow:hidden;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card .seal{position:absolute;right:8px;bottom:8px;width:30px;height:46px}
.card h3{font-size:1.05rem;margin-bottom:2px}
.card .au{font-size:.8rem;color:#6b5a3e}
.pv{margin-top:8px;font-size:1.1rem;line-height:1.9;height:140px;overflow:hidden}
.v{writing-mode:vertical-rl;text-orientation:upright}
.vbox{display:flex;justify-content:center;overflow-x:auto;padding:8px}
.vbox .v{font-size:1.6rem;line-height:2.1;letter-spacing:.15em;height:auto;max-height:420px}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:50}
.modal.on{display:flex}
.mbox{background:linear-gradient(160deg,#eee3c8,#d9cdab);color:#2a2118;max-width:760px;width:100%;border-radius:8px;padding:20px;position:relative;margin:auto}
.mbox h2{font-size:1.5rem;color:#2a2118}
.mbox .x{position:absolute;right:12px;top:8px;font-size:1.6rem;cursor:pointer;background:none;border:0;color:#2a2118}
.mbox h4{margin:14px 0 4px;color:var(--red);border-left:4px solid var(--red);padding-left:8px}
.mbox p{margin:4px 0;line-height:1.9}
.mbox .chip{background:#f3ead2;border-color:var(--red);color:var(--red)}
.mbox .btn{background:#2a2118;color:var(--gold)}
.prog{height:8px;background:#2a2521;border-radius:4px;overflow:hidden;min-width:120px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));width:0}
.boardwrap{display:flex;gap:16px;flex-wrap:wrap}
.bcol{flex:1 1 340px;max-width:600px;position:relative}
canvas#bd{width:100%;height:auto;border-radius:4px;box-shadow:0 8px 24px #000a;cursor:pointer;display:block;touch-action:manipulation}
.rip{position:absolute;border:2px solid var(--gold);border-radius:50%;pointer-events:none;animation:rip .9s ease-out forwards}
@keyframes rip{from{width:6px;height:6px;opacity:.9;margin:-3px}to{width:90px;height:90px;opacity:0;margin:-45px}}
#whisper{min-height:92px;padding:12px;border:1px dashed #5a4e3c;border-radius:6px;background:#17140f;animation:fd .8s}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.side{flex:1 1 280px}
.omi{background:#17140f;border:1px solid #3a342c;border-radius:6px;padding:12px;margin-top:14px}
.q{background:#17140f;border:1px solid #3a342c;border-radius:6px;padding:14px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;background:#221e1a;border:1px solid #4a4238;color:var(--tx);border-radius:4px;cursor:pointer;font:inherit}
.opt.ok{background:#1e4a2c;border-color:#4caf6f}.opt.ng{background:#5a1f1a;border-color:var(--red)}
.exp{margin-top:8px;padding:8px;background:#201b14;border-left:3px solid var(--gold);line-height:1.8}
.poemout{background:linear-gradient(160deg,#eadfc4,#d6c9a6);color:#2a2118;border-radius:6px;padding:14px;margin-top:12px}
.lab{display:block;margin:10px 0 3px;color:var(--gold);font-size:.9rem}
.fl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media(max-width:560px){.tab{padding:7px 10px;font-size:.85rem}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>爛柯の盤 <span class="seal" style="width:26px;height:40px">爛柯</span></h1>
<p>囲碁漢詩と宇宙観のギャラリー</p>
</div></header>
<div class="wrap">
<nav class="tabs">

<section id="t1" class="sec on">
<div class="bar">
<input id="q" placeholder="例：爛柯・手談・烏鷺・杜甫" size="22"><button class="btn" id="qgo">検索</button>
<span style="color:#a89c82">飛花令</span><input id="hk" maxlength="1" size="2" placeholder="棋"><button class="btn" id="hkgo">一字で詠む</button>
<button class="btn" id="vt">縦書き/横書き</button><button class="btn" id="favf">★お気に入りのみ</button><button class="btn" id="dexb">用語図鑑</button>
<span id="dexp" style="font-size:.85rem;color:#a89c82"></span><div class="prog"><i id="dexbar"></i></div>
</div>

<div class="bar"><button class="btn" id="b19">19路</button><button class="btn" id="b9">9路</button><button class="btn" id="mute">🔊 打音ON</button><button class="btn" id="star">星の宇宙的意味</button><button class="btn" id="rst">初手に戻す</button></div>

<div class="bar" id="moods"></div><div id="omiout"></div></div>
</div></div>
</section>

<section id="t3" class="sec">
<div class="bar"><span>難易度：</span><button class="btn" data-lv="0">初級（入門〜初段）</button><button class="btn" data-lv="1">中級（二段〜五段）</button><button class="btn" data-lv="2">上級（六段〜九段）</button><span id="best" style="font-size:.85rem;color:#a89c82"></span></div>
<div id="quiz" class="q">難易度を選んで対局開始。</div>
</section>

<section id="t4" class="sec">
<label class="lab">現代文</label>
<textarea id="src" placeholder="例：休日に友人と縁側で碁を打ち、気づけば夕暮れになっていた"></textarea>
<div class="fl" style="margin:6px 0"><span class="chip ex">休日に友人と縁側で碁を打ち、気づけば夕暮れになっていた</span><span class="chip ex">大石を取られて悔しいが、次こそ勝ちたい</span><span class="chip ex">雨の夜、静かに茶を飲みながら一人で棋譜を並べる</span></div>
<div class="fl"><select id="frm"><option value="5z">五言絶句</option><option value="7z">七言絶句</option><option value="5r">五言律詩</option></select>
<select id="tone"><option value="0">白居易風「閑適・静寂」</option><option value="1">杜甫風「憂愁・真剣勝負」</option><option value="2">蘇軾・爛柯風「達観・仙界」</option></select>
<button class="btn red" id="mk">擬似作詩</button><button class="btn" id="cp">LLM用プロンプトをコピー</button></div>
<div id="gen"></div>

</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rb=(w,r)=>`<ruby>${w}<rt>${r}</rt></ruby>`;

/* ---------- 用語図鑑 ---------- */
const TERMS=[
{id:'爛柯',r:'らんか',s:'晋の樵夫・王質が石室山で童子たちの碁を眺めるうち、斧の柄（柯）が朽ち果てていたという故事（『述異記』）。時を忘れるほどの没入、碁の美称です。'},
{id:'手談',r:'しゅだん',s:'言葉を交わさず、石で語り合うこと。『世説新語』に、支道林が囲碁を「手談」と呼んだとあります。'},
{id:'烏鷺',r:'うろ',s:'黒石を烏（カラス）、白石を鷺（サギ）に見立てた呼び名。黒白の争いを鳥の姿で雅に言い表します。'},
{id:'坐隠',r:'ざいん',s:'座ったまま俗世を離れ、隠者のように過ごせること。『世説新語』で王坦之が囲碁を「坐隠」と呼んだとされます。'},
{id:'忘憂',r:'ぼうゆう',s:'憂いを忘れさせるもの、の意。碁に没頭すれば世の煩いを忘れる、という碁の別称です。'},
{id:'方円',r:'ほうえん',s:'四角い盤（方）と丸い石（円）。盤を地、石を天に見立てる宇宙観にも通じます。'},
{id:'楸枰',r:'しゅうへい',s:'楸（ひさぎ）の木で作った盤。「枰」は碁盤のこと。詩では碁盤そのものを雅に呼びます。'},
{id:'橘中仙',r:'きっちゅうのせん',s:'巴邛の人が橘の実を割ると、中で老人たちが碁を打っていたという故事（『幽怪録』）。橘中の楽とも言い、碁の楽しみの象徴です。'},
{id:'天円地方',r:'てんえんちほう',s:'天は円く地は方形という古代中国の宇宙観。方形の盤と丸い石は、この世界像の縮図と見られます。'},
{id:'陰陽',r:'いんよう',s:'万物を陰と陽の対で捉える『易経』の思想。黒白の石は陰陽の対立と調和を表すとされます。'},
{id:'361',r:'さんびゃくろくじゅういち',s:'19×19＝361の交点。中央の天元（1）と周囲の360で、「三百六十と一」と語られ、一年の日数や周天の数になぞらえられます。'},
{id:'四隅四季',r:'よすみしき',s:'盤の四隅を春夏秋冬に、四辺を季節の移ろいに見立てる解釈。天元は不動の北極星にたとえられます。'}];
const TM=Object.fromEntries(TERMS.map(t=>[t.id,t]));
let dex=ST.g('rk_dex',[]);
function dexUpd(){const n=dex.length,t=TERMS.length;$('#dexp').textContent=`図鑑 ${n}/${t}（達成率${Math.round(n/t*100)}%）`;$('#dexbar').style.width=(n/t*100)+'%'}
function openTerm(id){const t=TM[id];if(!t)return;if(!dex.includes(id)){dex.push(id);ST.s('rk_dex',dex);dexUpd()}
$('#tb').innerHTML=`<button class="x" onclick="$('#tmodal').classList.remove('on')">×</button><h2>${rb(t.id,t.r)} <span class="seal" style="width:22px;height:34px">${t.id.slice(0,2)}</span></h2><p>${t.s}</p><p style="font-size:.8rem;color:#6b5a3e">図鑑に記録しました（${dex.length}/${TERMS.length}）</p>`;$('#tmodal').classList.add('on')}
function openDex(){$('#tb').innerHTML=`<button class="x" onclick="$('#tmodal').classList.remove('on')">×</button><h2>用語・宇宙観図鑑</h2><p>達成率 ${Math.round(dex.length/TERMS.length*100)}%</p>`+TERMS.map(t=>dex.includes(t.id)?`<span class="chip" onclick="openTerm('${t.id}')">${rb(t.id,t.r)}</span>`:`<span class="chip" style="opacity:.5" onclick="openTerm('${t.id}')">？？？</span>`).join('');$('#tmodal').classList.add('on')}

/* ---------- 漢詩マスターデータ ---------- */
const POEMS=[
{id:'kouson',title:'江村',au:'杜甫',era:'唐・七言律詩',go:1,
L:['清江一曲抱村流','長夏江村事事幽','自去自来梁上燕','相親相近水中鷗','老妻畫紙爲棋局','稚子敲針作釣鉤','多病所須唯藥物','微軀此外更何求'],
K:['清江一曲 村を抱いて流れ','長夏の江村 事事幽なり','自ずから去り自ずから来たる 梁上の燕','相親しみ相近づく 水中の鷗','老妻は紙に画いて 棋局と為し','稚子は針を敲いて 釣鉤を作る','多病 須つ所は 唯だ薬物','微躯 此の外 更に何をか求めん'],
G:'澄んだ川が村を抱くように曲がって流れ、夏の長い日、江村はどこもかしこも静かだ。梁の燕は自由に去来し、水の鷗は親しげに寄ってくる。老妻は紙に線を引いて碁盤をこしらえ、幼い子は針を曲げて釣り針にする。病がちの私に要るのは薬だけ、このうえ何を望もう。',
B:'成都の浣花草堂に落ち着いた杜甫が、束の間の平穏を詠んだ詩。第五句の「紙に線を引いた手作りの碁盤」は、貧しくも穏やかな家族の団欒を示します。起（情景）承（動物たちとの親しみ）転（家族の遊び）結（足るを知る心）と、外から内へ視線が絞られていく構成です。',
T:['方円','忘憂']},
{id:'shuko4',title:'秋興八首 其四',au:'杜甫',era:'唐・七言律詩',go:1,
L:['聞道長安似弈棋','百年世事不勝悲','王侯第宅皆新主','文武衣冠異昔時','直北關山金鼓振','征西車馬羽書馳','魚龍寂寞秋江冷','故國平居有所思'],
K:['聞道く 長安は弈棋に似たりと','百年の世事 悲しみに勝えず','王侯の第宅 皆新主','文武の衣冠 昔時に異なる','直北の関山 金鼓振るい','征西の車馬 羽書馳す','魚竜寂寞 秋江冷やかに','故国の平居 思う所有り'],
G:'長安は碁の勝負のようにめまぐるしく局面が変わると聞く。百年の世の出来事は悲しみに堪えない。王侯の屋敷は皆新しい主に替わり、文武百官の装いも昔とは違う。北の関山には軍鼓が鳴り、西征の車馬に急報の文書が駆ける。魚竜も寂しく秋の江は冷たい。故郷での平穏な日々が、しきりに思われる。',
B:'安史の乱後、夔州に滞在していた杜甫が長安を思う連作の一首。「弈棋」は、政権の交代や戦況が碁盤の石のように入れ替わる世の比喩で、碁を時勢批判に用いた代表例です。起承で嘆き、転で現状を列挙し、結で故郷への思慕に収めます。',
T:['烏鷺','陰陽']},
{id:'yakukyaku',title:'約客',au:'趙師秀',era:'南宋・七言絶句',go:1,
L:['黄梅時節家家雨','青草池塘處處蛙','有約不來過夜半','閑敲棋子落燈花'],
K:['黄梅の時節 家家の雨','青草の池塘 処処の蛙','約有れども来たらず 夜半を過ぎ','閑かに棋子を敲いて 灯花を落とす'],
G:'梅の実が熟す頃、どの家にも雨が降り、草の茂る池のほとりでは蛙があちこちで鳴く。客と約束したのに来ないまま夜半を過ぎ、手持ち無沙汰に碁石を軽く打ちつけて、燈芯にたまった灯花を落とす。',
B:'梅雨の夜の待ちぼうけを詠んだ名吟。結句の動作は、碁石で灯芯を叩いて燃えかすを落とす所作とされ、焦りと静けさが同居します。起承で雨と蛙の音、転で待つ心、結で碁石の音と、聴覚で貫かれた構成です。「閑敲棋子落灯花」は碁の詩句として最も愛されるひとつです。',
T:['手談','楸枰']},
{id:'chijo',title:'池上二首 其一',au:'白居易',era:'唐・五言絶句',go:1,
L:['山僧對棋坐','局上竹陰清','映竹無人見','時聞下子聲'],
K:['山僧 棋に対して坐し','局上 竹陰清し','竹に映じて 人の見る無く','時に聞く 子を下す声'],
G:'山の僧が向かい合って碁を打っている。盤の上には竹の陰が涼やかに落ちる。竹に隠れて人の姿は見えないが、ときおり石を打つ音だけが聞こえてくる。',
B:'白居易の閑適の境地を示す小品。姿を見せず「音だけ」で対局を描く手法が独創的で、竹の清涼さと静けさが際立ちます。起（坐）承（光景）転（不可視）結（打つ音）という構成で、碁の音が静寂を深める逆説が詩の核心です。',
T:['坐隠','楸枰']},

const find=id=>POEMS.concat(EXT).find(p=>p.id===id);
let EXT=[],vert=true,favOnly=false,favs=ST.g('rk_fav',[]),shown=POEMS.slice();

/* ---------- ギャラリー ---------- */
function hl(s,ch){return ch?esc(s).split(esc(ch)).join(`<b style="color:#c93a2b">${esc(ch)}</b>`):esc(s)}
let lim=60,lastCh='';
function renderGrid(list,ch){shown=list;lastCh=ch;let L=favOnly?list.filter(p=>favs.includes(p.id)):list;const tot=L.length;L=L.slice(0,lim);
$('#grid').innerHTML=L.length?L.map(p=>`<div class="card" onclick="openPoem('${p.id}')"><h3>${esc(p.title)}</h3><div class="au">${esc(p.au)}　${esc(p.era||'')}</div>
<div class="pv ${vert?'v':''}">${p.lines.slice(0,vert?4:3).map(l=>`<div>${hl(l,ch)}</div>`).join('')}</div>${p.go?'<span class="seal">碁詩</span>':''}${favs.includes(p.id)?'<span style="position:absolute;right:10px;top:6px;color:#c93a2b">★</span>':''}</div>`).join('')+(tot>lim?`<div style="grid-column:1/-1;text-align:center"><button class="btn" onclick="lim+=60;renderGrid(shown,lastCh)">もっと見る（${lim}/${tot}首）</button></div>`:''):'<p>該当する詩がありません。</p>'}
function localSearch(q){q=q.trim();if(!q)return POEMS.slice();return POEMS.filter(p=>(p.title+p.au+p.lines.join('')+p.kundoku.join('')+p.terms.join('')+p.kai).includes(q))}
async function extSearch(q){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),3000);
try{const r=await fetch('https://poetry.palemoky.com/api/v1/poems/search?q='+encodeURIComponent(q),{signal:ac.signal});if(!r.ok)throw 0;const d=await r.json();
const a=Array.isArray(d)?d:(d.poems||d.data||d.results||[]);
return a.slice(0,12).map((x,i)=>{const c=x.paragraphs||x.content||x.lines||'';const ls=(Array.isArray(c)?c:String(c).split(/[。！？\n]/)).map(s=>String(s).replace(/[，,]/g,'').trim()).filter(Boolean);
return{id:'x'+Date.now()+i,title:x.title||x.rhythmic||'無題',au:(x.author&&x.author.name)||x.author||'作者不詳',era:'外部データ',go:0,lines:ls,kundoku:[],gendai:'',kai:'外部API（詩泉）から取得した詩です。書き下し・現代語訳は内蔵データにのみ収録しています。',terms:[]}}).filter(p=>p.lines.length)}
catch(e){return[]}finally{clearTimeout(t)}}
async function doSearch(q,ch){lim=60;$('#stat').textContent='検索中…';const loc=localSearch(q);renderGrid(loc,ch);
const ex=await extSearch(q||ch);EXT=ex;const all=loc.concat(ex.filter(e=>!loc.some(l=>l.title===e.title&&l.au===e.au)));
renderGrid(all,ch);$('#stat').textContent=`${all.length}首${ex.length?'（外部データ'+ex.length+'首を含む）':''}`}
function hika(ch){lim=60;ch=ch.trim().slice(0,1);if(!ch)return;const m=POEMS.filter(p=>p.lines.join('').includes(ch)).sort(()=>Math.random()-.5);
