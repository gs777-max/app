<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI音声メモ">
<title>🎙️ AI Voice Memo & Auto Categorizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0b0f19;
  --bg-secondary: #111827;
  --bg-card: rgba(17, 24, 39, 0.75);
  --bg-glass: rgba(15, 23, 42, 0.85);
  --border-glass: rgba(255, 255, 255, 0.12);
  --border-hover: rgba(255, 255, 255, 0.25);
  --border-focus: #38bdf8;
  
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  
  --accent-blue: #38bdf8;
  --accent-indigo: #6366f1;
  --accent-cyan: #06b6d4;
  --accent-green: #10b981;
  --accent-amber: #f59e0b;
  --accent-rose: #f43f5e;
  --accent-purple: #a855f7;
  
  /* カテゴリ別カラー */
  --cat-todo: #38bdf8;
  --cat-idea: #f59e0b;
  --cat-homework: #ec4899;
  --cat-memo: #10b981;
  --cat-other: #a855f7;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body, html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-primary);
  font-family: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
  color: var(--text-main);
  user-select: none;
  -webkit-user-select: none;
}

input, textarea, select, button, [contenteditable="true"] {
  user-select: text;
  -webkit-user-select: text;
  font-family: inherit;
}

/* アプリ全体コンテナ */
#app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 960px;
  margin: 0 auto;
  position: relative;
  background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 50%),
              radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.08) 0%, transparent 40%),
              var(--bg-primary);
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
}

/* ヘッダー */
header {
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-glass);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
  flex-shrink: 0;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-indigo) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  box-shadow: 0 0 18px rgba(56, 189, 248, 0.4);
}

.brand-title h1 {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-title p {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 600;
}

.header-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}

.icon-btn {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--border-glass);
  color: var(--text-main);
  border-radius: 9px;
  padding: 6px 11px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
}

.icon-btn:hover {
  background: rgba(255, 255, 255, 0.14);
  border-color: var(--border-hover);
  transform: translateY(-1px);
}

.icon-btn:active {
  transform: scale(0.95);
}

/* サンプル音声・デモバー */
.demo-preset-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  background: rgba(15, 23, 42, 0.7);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
}
.demo-preset-bar::-webkit-scrollbar { display: none; }

.demo-tag-label {
  font-size: 10px;
  font-weight: 800;
  color: var(--accent-blue);
  white-space: nowrap;
}

.preset-chip {
  padding: 3px 9px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-glass);
  color: #cbd5e1;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.preset-chip:hover {
  background: rgba(56, 189, 248, 0.15);
  border-color: var(--accent-blue);
  color: #fff;
}

/* 検索 & 統計バー */
.search-stat-bar {
  padding: 8px 16px;
  display: flex;
  gap: 8px;
  align-items: center;
  background: rgba(18, 24, 38, 0.5);
  border-bottom: 1px solid var(--border-glass);
  flex-shrink: 0;
}

.search-box {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

.search-icon {
  position: absolute;
  left: 10px;
  font-size: 13px;
  color: var(--text-dim);
  pointer-events: none;
}

.search-input {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-glass);
  border-radius: 9px;
  padding: 6px 12px 6px 30px;
  font-size: 12.5px;
  color: #fff;
  outline: none;
  transition: all 0.2s;
}

.search-input:focus {
  background: rgba(255, 255, 255, 0.09);
  border-color: var(--border-focus);
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
}

.stat-pill {
  padding: 5px 9px;
  background: rgba(56, 189, 248, 0.12);
  border: 1px solid rgba(56, 189, 248, 0.25);
  border-radius: 9px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent-blue);
  white-space: nowrap;
}

/* カテゴリ・ビュートグル */
.tabs-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 16px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-glass);
  gap: 8px;
  flex-shrink: 0;
}

.category-tabs {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.category-tabs::-webkit-scrollbar { display: none; }

.cat-tab {
  padding: 4px 10px;
  border-radius: 14px;
  font-size: 11.5px;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-glass);
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.cat-tab.active {
  background: rgba(56, 189, 248, 0.2);
  border-color: var(--accent-blue);
  color: #ffffff;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
}

.view-mode-toggle {
  display: flex;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 7px;
  padding: 2px;
  border: 1px solid var(--border-glass);
  flex-shrink: 0;
}

.view-toggle-btn {
  padding: 4px 8px;
  border-radius: 5px;
  font-size: 12px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}

.view-toggle-btn.active {
  background: var(--accent-blue);
  color: #0f172a;
  font-weight: 800;
}

/* メモ一覧領域 */
#memo-content-area {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  -webkit-overflow-scrolling: touch;
}

/* リストビュー */
.memo-list-view {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.memo-card {
  background: var(--bg-card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border-glass);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
}

.memo-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-1px);
}

.memo-card.completed {
  opacity: 0.65;
  background: rgba(18, 24, 38, 0.45);
}
.memo-card.completed .memo-text {
  text-decoration: line-through;
  color: var(--text-muted);
}

.memo-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.memo-badges {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}

.badge {
  font-size: 10px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 6px;
  letter-spacing: 0.02em;
}

.badge-todo { background: rgba(56, 189, 248, 0.16); color: var(--cat-todo); border: 1px solid rgba(56, 189, 248, 0.4); }
.badge-idea { background: rgba(245, 158, 11, 0.16); color: var(--cat-idea); border: 1px solid rgba(245, 158, 11, 0.4); }
.badge-homework { background: rgba(236, 72, 153, 0.16); color: var(--cat-homework); border: 1px solid rgba(236, 72, 153, 0.4); }
.badge-memo { background: rgba(16, 185, 129, 0.16); color: var(--cat-memo); border: 1px solid rgba(16, 185, 129, 0.4); }
.badge-other { background: rgba(168, 85, 247, 0.16); color: var(--cat-other); border: 1px solid rgba(168, 85, 247, 0.4); }

.badge-status {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.badge-status:hover {
  filter: brightness(1.2);
}
.status-not-started { background: rgba(100, 116, 139, 0.25); color: #cbd5e1; border: 1px solid rgba(100, 116, 139, 0.35); }
.status-in-progress { background: rgba(56, 189, 248, 0.25); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
.status-completed { background: rgba(16, 185, 129, 0.25); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
.status-on-hold { background: rgba(245, 158, 11, 0.25); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }

.badge-priority {
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 5px;
}
.prio-high { color: #f43f5e; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); }
.prio-medium, .prio-med { color: #f59e0b; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); }
.prio-low { color: #94a3b8; background: rgba(148, 163, 184, 0.12); border: 1px solid rgba(148, 163, 184, 0.2); }

.badge-due {
  color: #60a5fa;
  background: rgba(96, 165, 250, 0.14);
  border: 1px solid rgba(96, 165, 250, 0.3);
  display: flex;
  align-items: center;
  gap: 3px;
}

.memo-card-actions {
  display: flex;
  gap: 4px;
}

.card-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
  transition: all 0.15s;
}
.card-btn:hover { color: #fff; background: rgba(255,255,255,0.12); }
.card-btn:active { transform: scale(0.9); }

.memo-text {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text-main);
  word-break: break-word;
  white-space: pre-wrap;
}

.memo-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10.5px;
  color: var(--text-dim);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  padding-top: 6px;
}

/* カンバンボードビュー */
.kanban-view {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  align-items: flex-start;
}

.kanban-col {
  background: rgba(18, 24, 38, 0.6);
  border: 1px solid var(--border-glass);
  border-radius: 14px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 280px;
}

.kanban-col-header {
  font-size: 12px;
  font-weight: 800;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-glass);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.kanban-card {
  background: var(--bg-card);
  border: 1px solid var(--border-glass);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: all 0.15s ease;
}
.kanban-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-1px);
}

/* 空ステート */
.empty-state {
  text-align: center;
  padding: 50px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--text-muted);
}
.empty-icon {
  font-size: 44px;
  opacity: 0.8;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* フッター録音・入力バー */
#footer-recording-bar {
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--bg-glass);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border-top: 1px solid var(--border-glass);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 30;
  flex-shrink: 0;
}

/* リアルタイム音声波形（CSSアニメーションバー） */
#visualizer-container {
  width: 100%;
  height: 28px;
  background: rgba(0, 0, 0, 0.4);
  border-radius: 8px;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 12px;
}
.waveform-bar {
  flex: 1;
  max-width: 6px;
  height: 6px;
  background: var(--accent-blue);
  border-radius: 3px;
  transition: height 0.1s ease;
  animation: wavePulse 0.8s ease-in-out infinite alternate;
}
.waveform-bar:nth-child(2n) { animation-delay: 0.15s; background: var(--accent-cyan); }
.waveform-bar:nth-child(3n) { animation-delay: 0.3s; background: var(--accent-indigo); }
.waveform-bar:nth-child(4n) { animation-delay: 0.45s; background: var(--accent-purple); }

@keyframes wavePulse {
  0% { height: 4px; opacity: 0.3; }
  100% { height: 22px; opacity: 1; }
}

/* リアルタイム文字起こしプレビューバブル */
#live-transcript-bubble {
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.18) 0%, rgba(168, 85, 247, 0.18) 100%);
  border: 1px solid rgba(56, 189, 248, 0.4);
  border-radius: 12px;
  padding: 8px 14px;
  font-size: 13px;
  color: #fff;
  display: none;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}

.live-pulse-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent-rose);
  box-shadow: 0 0 10px var(--accent-rose);
  animation: pulse 0.9s infinite alternate;
  flex-shrink: 0;
}
@keyframes pulse { from { opacity: 0.4; transform: scale(0.9); } to { opacity: 1; transform: scale(1.25); } }

.recording-controls-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.text-input-box {
  flex: 1;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--border-glass);
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 13.5px;
  color: #fff;
  outline: none;
  transition: all 0.2s;
}
.text-input-box:focus {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--border-focus);
}

/* 送信ボタン */
#btn-send-memo {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-indigo) 100%);
  color: #ffffff;
  font-size: 17px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
  transition: all 0.15s ease;
  flex-shrink: 0;
}
#btn-send-memo:hover {
  transform: scale(1.08);
  box-shadow: 0 0 18px rgba(56, 189, 248, 0.5);
}
#btn-send-memo:active { transform: scale(0.92); }

/* メイン録音ボタン */
#mic-main-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
  color: #ffffff;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  flex-shrink: 0;
}

#mic-main-btn:hover {
  transform: scale(1.06);
}

#mic-main-btn.recording {
  background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
  box-shadow: 0 0 28px rgba(244, 63, 94, 0.85);
  animation: recordPulse 1.1s infinite;
}

@keyframes recordPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.12); }
  100% { transform: scale(1); }
}

/* モーダル */
.modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.modal-backdrop.show {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  width: 100%;
  max-width: 480px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-glass);
  border-radius: 18px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
}

.modal-title {
  font-size: 16px;
  font-weight: 800;
}

.modal-textarea {
  width: 100%;
  height: 90px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-glass);
  border-radius: 10px;
  padding: 10px;
  font-size: 13.5px;
  color: #fff;
  resize: vertical;
  outline: none;
}
.modal-textarea:focus { border-color: var(--border-focus); }

.modal-form-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.form-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 700;
}

.form-select, .form-input {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border-glass);
  border-radius: 8px;
  padding: 7px 10px;
  color: #fff;
  font-size: 13px;
  outline: none;
}
.form-select option {
  background: #1e293b;
  color: #fff;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 6px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-indigo) 100%);
  color: #ffffff;
  border: none;
  padding: 9px 18px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  border: 1px solid var(--border-glass);
  padding: 9px 18px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}

<script>
(function() {
  'use strict';

  // ==========================================
  // 1. 自然言語解析（NLP Categorizer）
  // ==========================================
  class NLPAnalyzer {
    static CATEGORY_PATTERNS = {
      homework: [
        /宿題/i, /課題/i, /レポート/i, /ドリル/i, /予習/i, /復習/i, /教科書/i,
        /ワーク/i, /プリント/i, /提出物/i, /テスト勉強/i, /小テスト/i, /英語の/i, /数学の/i, /国語/i, /理科/i, /社会/i
      ],
      idea: [
        /アイデア/i, /思いつき/i, /ひらめき/i, /企画/i, /企画案/i, /案/i, /はどうだろう/i, /かも/i,
        /新機能/i, /作ってみたい/i, /開発/i, /ビジネス/i, /デザイン/i, /改善案/i, /発想/i, /構想/i
      ],
      memo: [
        /パスワード/i, /合言葉/i, /メモ/i, /番号/i, /コード/i, /記録/i, /住所/i, /URL/i,
        /要確認/i, /忘れないよう/i, /備忘/i, /控え/i, /リンク/i, /ID/i, /アカウント/i, /メールアドレス/i
      ],
      todo: [
        /買う/i, /買ってくる/i, /購入/i, /する/i, /やる/i, /行く/i, /連絡/i, /電話/i, /メール/i,
        /送信/i, /予約/i, /振込/i, /支払い/i, /提出/i, /掃除/i, /片付け/i, /準備/i, /作成/i,
        /タスク/i, /TODO/i, /しなきゃ/i, /すること/i, /洗車/i, /ゴミ出し/i, /返信/i, /確認/i
      ]
    };

    static PRIORITY_PATTERNS = {
      high: [/至急/i, /急ぎ/i, /今日中/i, /今すぐ/i, /明日まで/i, /最優先/i, /重要/i, /絶対に/i, /ヤバい/i, /必須/i, /緊急/i],
      low: [/いつか/i, /時間ある時/i, /暇な時/i, /余裕があれば/i, /後で/i, /来月/i, /そのうち/i]
    };

    static extractDueDate(text) {
      const now = new Date();
      
      if (/今日|本日/i.test(text)) {
        return '今日中';
      }
      if (/明日/i.test(text)) {
        const d = new Date(now);
        d.setDate(d.getDate() + 1);
        return `${d.getMonth() + 1}/${d.getDate()} (明日)`;
      }
      if (/明後日/i.test(text)) {
        const d = new Date(now);
        d.setDate(d.getDate() + 2);
        return `${d.getMonth() + 1}/${d.getDate()} (明後日)`;
      }
      if (/来週月曜|来週の月曜/i.test(text)) return '来週月曜';
      if (/来週金曜|来週の金曜/i.test(text)) return '来週金曜';
      if (/今週末/i.test(text)) return '今週末';

      const dateMatch = text.match(/(\d{1,2})月(\d{1,2})日/) || text.match(/(\d{1,2})\/(\d{1,2})/);
      const timeMatch = text.match(/(\d{1,2})時(\d{1,2})?分?/) || text.match(/(\d{1,2}):(\d{2})/);
      
      let res = '';
      if (dateMatch) res += `${dateMatch[1]}/${dateMatch[2]}`;
      if (timeMatch) res += ` ${timeMatch[1]}:${timeMatch[2] || '00'}`;
      
      return res || null;
    }

    static analyze(text) {
      const trimmed = text.trim();
      let category = 'other';
      
      if (this.CATEGORY_PATTERNS.homework.some(p => p.test(trimmed))) category = 'homework';
      else if (this.CATEGORY_PATTERNS.idea.some(p => p.test(trimmed))) category = 'idea';
      else if (this.CATEGORY_PATTERNS.memo.some(p => p.test(trimmed))) category = 'memo';
      else if (this.CATEGORY_PATTERNS.todo.some(p => p.test(trimmed))) category = 'todo';
      else category = 'todo';

      let priority = 'medium';
      if (this.PRIORITY_PATTERNS.high.some(p => p.test(trimmed))) priority = 'high';
      else if (this.PRIORITY_PATTERNS.low.some(p => p.test(trimmed))) priority = 'low';

      const dueDate = this.extractDueDate(trimmed);

      return {
        category,
        priority,
        dueDate,
        status: 'not_started'
      };
    }
  }

  // ==========================================
  // 2. メモストレージ管理 (LocalStorage)
  // ==========================================
  class MemoStore {
    static STORAGE_KEY = 'ai_voice_memo_data_v1';

    static loadMemos() {
      try {
        const raw = localStorage.getItem(this.STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {
        console.warn("Storage load error, using initial samples:", e);
      }
      return this.getInitialSampleMemos();
    }

    static saveMemos(memos) {
      try {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(memos));
      } catch (e) {
        console.error("Storage save error:", e);
      }
    }

    static getInitialSampleMemos() {

        }
      ];
    }
  }

  // ==========================================
  // 3. iOS & クロスブラウザ完全対応 Web Speech API マネージャー
  // ==========================================
  class SpeechInputManager {
    constructor(onLiveTranscript, onFinalTranscript, onStateChange) {
      this.onLiveTranscript = onLiveTranscript;
      this.onFinalTranscript = onFinalTranscript;
      this.onStateChange = onStateChange;
      
      this.recognition = null;
      this.isRecording = false;
      this.userRequestedStop = false;
      this.currentTranscript = '';
      
      this.visualizerEl = document.getElementById('visualizer-container');
    }

    isSupported() {
      return ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
    }

    createRecognitionInstance() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const rec = new SpeechRecognition();
      rec.lang = 'ja-JP';
      
      // iOS WebKit では continuous=true が例外や停止を招くため false に設定
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      rec.continuous = !isIOS;
      rec.interimResults = true;
      rec.maxAlternatives = 1;

      rec.onstart = () => {
        this.isRecording = true;
        this.currentTranscript = '';
        this.onStateChange(true);
        if (this.visualizerEl) this.visualizerEl.style.display = 'flex';
      };

      rec.onresult = (event) => {
        let interim = '';
        let final = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            final += transcript;
          } else {
            interim += transcript;
          }
        }

        if (interim) {
          this.onLiveTranscript(interim);
        }
        if (final) {
          this.currentTranscript += final;
          this.onFinalTranscript(this.currentTranscript);
          this.currentTranscript = '';
        }
      };

      rec.onerror = (event) => {
        console.warn("Speech recognition event error:", event.error);
        if (event.error === 'not-allowed') {
          showToast("⚠️ マイク許可が必要です（Safari設定からマイクを許可してください）");
        } else if (event.error === 'network') {
          showToast("⚠️ 音声認識ネットワークエラーが発生しました（通信環境をご確認ください）");
        } else if (event.error === 'audio-capture') {
          showToast("⚠️ マイクが他のアプリで使用されているか利用できません");
        }
        this.stop();
      };

      rec.onend = () => {
        if (this.isRecording && !this.userRequestedStop) {
          // iOS以外の環境で自動継続が必要な場合
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (!isIOS) {
            try {
              rec.start();
              return;
            } catch (e) {}
          }
        }
        this.stop();
      };

      return rec;
    }

    start() {
      if (!this.isSupported()) {
        showToast("💡 このブラウザはWeb Speech音声認識非対応です（テキスト入力またはサンプルをご利用ください）");
        return false;
      }

      // 非セキュア（httpかつlocalhost以外）の場合の警告
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1' && location.protocol !== 'file:') {
        showToast("⚠️ iOS/ブラウザのセキュリティ制限により、音声認識にはHTTPS接続が必要です");
      }

      this.userRequestedStop = false;

      // 既存インスタンスの破棄とフレッシュインスタンスの生成（iOS SafariのInvalidStateError対策）
      if (this.recognition) {
        try { this.recognition.abort(); } catch(e) {}
        this.recognition = null;
      }

      this.recognition = this.createRecognitionInstance();
      if (!this.recognition) return false;

      try {
        // ユーザージェスチャーハンドラ内から直接同期呼び出し
        this.recognition.start();
        return true;
      } catch (e) {
        console.error("Recognition start error:", e);
        showToast("⚠️ 音声認識の起動に失敗しました（もう一度タップしてください）");
        this.stop();
        return false;
      }
    }

    stop() {
      this.userRequestedStop = true;
      this.isRecording = false;
      if (this.visualizerEl) this.visualizerEl.style.display = 'none';

      if (this.recognition) {
        try { this.recognition.stop(); } catch(e) {}
        this.recognition = null;
      }
      this.onStateChange(false);
    }
  }

  // ==========================================
  // 4. アプリケーション コア Controller
  // ==========================================
  class AIVoiceMemoApp {
    constructor() {
      this.memos = MemoStore.loadMemos();
      this.currentFilterCat = 'all';
      this.currentViewMode = 'list';
      this.searchQuery = '';
      this.editingMemoId = null;

      this.speechManager = new SpeechInputManager(
        (interimText) => this.handleLiveTranscript(interimText),
        (finalText) => this.handleFinalTranscript(finalText),
        (isRecording) => this.handleRecordingState(isRecording)
      );

      this.bindDOMElements();
      this.bindEvents();
      this.render();
    }

    bindDOMElements() {
      this.memoListEl = document.getElementById('memo-list-container');
      this.kanbanEl = document.getElementById('kanban-container');
      this.searchInput = document.getElementById('search-input');
      this.statActiveCountEl = document.getElementById('stat-active-count');

      this.quickInput = document.getElementById('quick-text-input');
      this.liveBubble = document.getElementById('live-transcript-bubble');
      this.liveText = document.getElementById('live-transcript-text');

      // モーダル要素
      this.editModal = document.getElementById('edit-modal');
      this.modalHeading = document.getElementById('modal-heading');
      this.modalText = document.getElementById('modal-memo-text');
      this.modalCat = document.getElementById('modal-cat-select');
      this.modalStatus = document.getElementById('modal-status-select');
      this.modalPriority = document.getElementById('modal-priority-select');

      // インポート/エクスポート
      this.fileImportInput = document.getElementById('file-import-input');
      this.btnImportTrigger = document.getElementById('btn-import-trigger');
      this.btnExport = document.getElementById('btn-export');
    }

    bindEvents() {
      // マイク録音トグル (touchend / click 両対応でiOSのUser Activationを確実化)
      const handleMicTap = (e) => {
        e.preventDefault();
        this.toggleRecording();
      };
      this.micBtn.addEventListener('click', handleMicTap);

      // 送信ボタンクリック
      this.sendBtn.addEventListener('click', () => this.submitQuickInput());

      // クイックテキスト入力 (Enterキー)
      this.quickInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          this.submitQuickInput();
        }
      });

      // サンプル音声プリセットチップ
      document.querySelectorAll('.preset-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const sampleText = chip.dataset.sample;
          if (sampleText) {
            this.createMemo(sampleText);
          }
        });
      });

      // 検索フィルター
      this.searchInput.addEventListener('input', (e) => {
        this.searchQuery = e.target.value.toLowerCase().trim();
        this.render();
      });

      // カテゴリタブ切り替え
      document.querySelectorAll('.cat-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          this.currentFilterCat = tab.dataset.cat;
          this.render();
        });
      });

      // ビュー切り替え
      document.getElementById('view-btn-list').addEventListener('click', () => {
        this.currentViewMode = 'list';
        document.getElementById('view-btn-list').classList.add('active');
        document.getElementById('view-btn-kanban').classList.remove('active');
        this.render();
      });
      document.getElementById('view-btn-kanban').addEventListener('click', () => {
        this.currentViewMode = 'kanban';
        document.getElementById('view-btn-kanban').classList.add('active');
        document.getElementById('view-btn-list').classList.remove('active');
        this.render();
      });

      // 手動追加ボタン
      document.getElementById('btn-manual-add').addEventListener('click', () => this.openCreateModal());

      // エクスポート & インポート
      this.btnExport.addEventListener('click', () => this.exportData());
      this.btnImportTrigger.addEventListener('click', () => this.fileImportInput.click());
      this.fileImportInput.addEventListener('change', (e) => this.handleFileImport(e));

      // モーダル保存・キャンセル
      document.getElementById('modal-save-btn').addEventListener('click', () => this.saveModalData());
      document.getElementById('modal-cancel-btn').addEventListener('click', () => this.closeModal());
      this.editModal.addEventListener('click', (e) => {
        if (e.target === this.editModal) this.closeModal();
      });

      // メモコンテンツ領域のイベントデリゲーション (安全なアクション実行)
      document.getElementById('memo-content-area').addEventListener('click', (e) => {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        const action = target.dataset.action;
        const memoId = target.dataset.id;

        if (action === 'toggle-status') {
          this.toggleStatus(memoId);
        } else if (action === 'speak') {
          const memo = this.memos.find(m => m.id === memoId);
          if (memo) this.speakMemo(memo.text);
        } else if (action === 'edit') {
          this.openEditModal(memoId);
        } else if (action === 'delete') {
          this.deleteMemo(memoId);
        }
      });
    }

    submitQuickInput() {
      const text = this.quickInput.value.trim();
      if (!text) return;
      this.createMemo(text);
      this.quickInput.value = '';
    }

    toggleRecording() {
      if (this.speechManager.isRecording) {
        this.speechManager.stop();
        showToast("録音を終了しました");
      } else {
        const started = this.speechManager.start();
        if (started) {
          showToast("🎙️ 聴き取っています...（話しかけてください）");
        }
      }
    }

    handleRecordingState(isRecording) {
      if (isRecording) {
        this.micBtn.classList.add('recording');
        this.micBtn.textContent = '⏹️';
        this.liveBubble.style.display = 'flex';
        this.liveText.textContent = 'お話しください...';
      } else {
        this.micBtn.classList.remove('recording');
        this.micBtn.textContent = '🎙️';
        this.liveBubble.style.display = 'none';
      }
    }

    handleLiveTranscript(text) {
      this.liveText.textContent = text;
    }

    handleFinalTranscript(text) {
      if (!text.trim()) return;
      this.createMemo(text.trim());
      this.liveText.textContent = `メモ作成: 「${text.substring(0, 15)}...」`;
      setTimeout(() => {
        if (this.speechManager.isRecording) this.liveText.textContent = '続けてお話しください...';
      }, 1500);
    }

    createMemo(text) {
      const analyzed = NLPAnalyzer.analyze(text);
      const nowStr = new Date().toLocaleString('ja-JP');

      const newMemo = {
        id: 'memo-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
        text: text,
        category: analyzed.category,
        status: analyzed.status,
        priority: analyzed.priority,
        dueDate: analyzed.dueDate,
        createdAt: nowStr,
        updatedAt: nowStr
      };

      this.memos.unshift(newMemo);
      MemoStore.saveMemos(this.memos);
      this.render();

      const catLabel = this.getCategoryLabel(newMemo.category);
      showToast(`✨ 【${catLabel}】として自動分類・保存しました`);
    }

    getCategoryLabel(cat) {
      const map = { todo: 'TODO', idea: 'アイデア', homework: '宿題・課題', memo: '備忘録', other: 'その他' };
      return map[cat] || 'その他';
    }

    getPriorityLabel(prio) {
      const map = { high: '🔴 高', medium: '🟡 中', low: '⚪ 低' };
      return map[prio] || '🟡 中';
    }

    toggleStatus(id) {
      const m = this.memos.find(x => x.id === id);
      if (!m) return;
      
      const order = ['not_started', 'in_progress', 'completed'];
      const nextIdx = (order.indexOf(m.status) + 1) % order.length;
      m.status = order[nextIdx];
      m.updatedAt = new Date().toLocaleString('ja-JP');

      MemoStore.saveMemos(this.memos);
      this.render();
      
      const statusNames = { not_started: '⏳ 未着手', in_progress: '⚡ 進行中', completed: '✅ 完了' };
      showToast(`ステータス更新: ${statusNames[m.status]}`);
    }

    deleteMemo(id) {
      if (!confirm("このメモを削除しますか？")) return;
      this.memos = this.memos.filter(x => x.id !== id);
      MemoStore.saveMemos(this.memos);
      this.render();
      showToast("🗑️ メモを削除しました");
    }

    speakMemo(text) {
      if (!('speechSynthesis' in window)) {
        showToast("⚠️ このブラウザは音声読み上げ非対応です");
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.0;
        window.speechSynthesis.speak(uttr);
        showToast("🔊 読み上げています...");
      } catch (e) {
        console.warn("Speech synthesis failed:", e);
      }
    }

    openEditModal(id) {
      const m = this.memos.find(x => x.id === id);
      if (!m) return;
      this.editingMemoId = id;
      this.modalHeading.textContent = "メモの編集";
      this.modalText.value = m.text;
      this.modalCat.value = m.category;
      this.modalStatus.value = m.status;
      this.modalPriority.value = m.priority;
      this.modalDue.value = m.dueDate || '';
      this.editModal.classList.add('show');
    }

    openCreateModal() {
      this.editingMemoId = null;
      this.modalHeading.textContent = "手動でメモを追加";
      this.modalText.value = '';
      this.modalCat.value = 'todo';
      this.modalStatus.value = 'not_started';
      this.modalPriority.value = 'medium';
      this.modalDue.value = '';
      this.editModal.classList.add('show');
    }

    closeModal() {
      this.editModal.classList.remove('show');
    }

    saveModalData() {
      const text = this.modalText.value.trim();
      if (!text) {
        showToast("⚠️ テキストを入力してください");
        return;
      }

      const nowStr = new Date().toLocaleString('ja-JP');

      if (this.editingMemoId) {
        const m = this.memos.find(x => x.id === this.editingMemoId);
        if (m) {
          m.text = text;
          m.category = this.modalCat.value;
          m.status = this.modalStatus.value;
          m.priority = this.modalPriority.value;
          m.dueDate = this.modalDue.value.trim() || null;
          m.updatedAt = nowStr;
        }
      } else {
        this.memos.unshift({
          id: 'memo-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
          text,
          category: this.modalCat.value,
          status: this.modalStatus.value,
          priority: this.modalPriority.value,
          dueDate: this.modalDue.value.trim() || null,
          createdAt: nowStr,
          updatedAt: nowStr
        });
      }

      MemoStore.saveMemos(this.memos);
      this.closeModal();
      this.render();
      showToast("💾 メモを保存しました");
    }

    exportData() {
      const json = JSON.stringify(this.memos, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `AI_Voice_Memos_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("📥 バックアップをダウンロードしました");
    }

    handleFileImport(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            this.memos = imported;
            MemoStore.saveMemos(this.memos);
            this.render();
            showToast(`📂 ${imported.length}件のメモを取り込みました`);
          } else {
            showToast("⚠️ 正しいJSONメモファイルではありません");
          }
        } catch (err) {
          showToast("⚠️ ファイル読み込みエラーが発生しました");
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    getFilteredMemos() {
      return this.memos.filter(m => {
        if (this.currentFilterCat !== 'all' && m.category !== this.currentFilterCat) {
          return false;
        }
        if (this.searchQuery) {
          const matchText = m.text.toLowerCase().includes(this.searchQuery);
          const matchCat = this.getCategoryLabel(m.category).toLowerCase().includes(this.searchQuery);
          const matchDue = m.dueDate && m.dueDate.toLowerCase().includes(this.searchQuery);
          if (!matchText && !matchCat && !matchDue) return false;
        }
        return true;
      });
    }

    render() {
      const filtered = this.getFilteredMemos();
      const activeCount = this.memos.filter(m => m.status !== 'completed').length;
      this.statActiveCountEl.textContent = `未完了: ${activeCount}件`;

      if (this.currentViewMode === 'list') {
        this.memoListEl.style.display = 'flex';
        this.kanbanEl.style.display = 'none';
        this.renderListView(filtered);
      } else {
        this.memoListEl.style.display = 'none';
        this.kanbanEl.style.display = 'grid';
        this.renderKanbanView(filtered);
      }
    }

    renderListView(memos) {
      if (memos.length === 0) {
        this.memoListEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎙️</div>
            <p style="font-weight:700;font-size:15px;color:#fff;">メモがありません</p>
            <p style="font-size:12px;">マイクを押して話しかけるか、下の入力欄またはサンプル入力からメモを追加してください</p>
          </div>`;
        return;
      }

      this.memoListEl.innerHTML = memos.map(m => {
        const catBadge = `badge-${m.category}`;
        const catLabel = this.getCategoryLabel(m.category);
        const prioClass = `prio-${m.priority}`;
        const prioLabel = this.getPriorityLabel(m.priority);
        const statusClass = `status-${(m.status || 'not_started').replace('_', '-')}`;
        const statusLabel = m.status === 'completed' ? '✅ 完了' : (m.status === 'in_progress' ? '⚡ 進行中' : '⏳ 未着手');

        return `
          <div class="memo-card ${m.status === 'completed' ? 'completed' : ''}" data-card-id="${m.id}">
            <div class="memo-header">
              <div class="memo-badges">
                <span class="badge ${catBadge}">${catLabel}</span>
                <span class="badge-status ${statusClass}" data-action="toggle-status" data-id="${m.id}" title="クリックで進捗切り替え">${statusLabel}</span>
                <span class="badge-priority ${prioClass}">${prioLabel}</span>
                ${m.dueDate ? `<span class="badge badge-due">📅 ${this.escapeHTML(m.dueDate)}</span>` : ''}
              </div>
              <div class="memo-card-actions">
                <button class="card-btn" data-action="speak" data-id="${m.id}" title="読み上げ">🔊</button>
                <button class="card-btn" data-action="edit" data-id="${m.id}" title="編集">✏️</button>
                <button class="card-btn" data-action="delete" data-id="${m.id}" title="削除">🗑️</button>
              </div>
            </div>
            <div class="memo-text">${this.escapeHTML(m.text)}</div>
            <div class="memo-footer">
              <span>記録: ${m.createdAt}</span>
              ${m.updatedAt && m.updatedAt !== m.createdAt ? `<span>更新: ${m.updatedAt}</span>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    renderKanbanView(memos) {
      const todoList = document.getElementById('kb-list-todo');
      const inProgList = document.getElementById('kb-list-inprogress');
      const compList = document.getElementById('kb-list-completed');

      const todos = memos.filter(m => m.status === 'not_started' || m.status === 'on_hold');
      const inProgs = memos.filter(m => m.status === 'in_progress');
      const comps = memos.filter(m => m.status === 'completed');

      document.getElementById('kb-count-todo').textContent = todos.length;
      document.getElementById('kb-count-inprogress').textContent = inProgs.length;
      document.getElementById('kb-count-completed').textContent = comps.length;

      const renderKanbanCard = (m) => `
        <div class="kanban-card ${m.status === 'completed' ? 'completed' : ''}">
          <div class="memo-header" style="margin-bottom:2px;">
            <span class="badge badge-${m.category}">${this.getCategoryLabel(m.category)}</span>
            <div style="display:flex;gap:2px;">
              <button class="card-btn" data-action="toggle-status" data-id="${m.id}" title="進捗切り替え">🔄</button>
              <button class="card-btn" data-action="edit" data-id="${m.id}" title="編集">✏️</button>
              <button class="card-btn" data-action="delete" data-id="${m.id}" title="削除">🗑️</button>
            </div>
          </div>
          <div class="memo-text" style="font-size:12.5px;">${this.escapeHTML(m.text)}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
            <span class="badge-priority prio-${m.priority}">${this.getPriorityLabel(m.priority)}</span>
            ${m.dueDate ? `<span style="font-size:10px;color:#60a5fa;">📅 ${this.escapeHTML(m.dueDate)}</span>` : ''}
          </div>
        </div>`;

      todoList.innerHTML = todos.map(renderKanbanCard).join('') || '<div style="font-size:11px;color:#64748b;text-align:center;padding:16px;">タスクなし</div>';
      inProgList.innerHTML = inProgs.map(renderKanbanCard).join('') || '<div style="font-size:11px;color:#64748b;text-align:center;padding:16px;">タスクなし</div>';
      compList.innerHTML = comps.map(renderKanbanCard).join('') || '<div style="font-size:11px;color:#64748b;text-align:center;padding:16px;">タスクなし</div>';
    }

    escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }
  }

  // グローバルトースト表示
  function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // 初期化
  window.app = null;
  window.addEventListener('DOMContentLoaded', () => {
    window.app = new AIVoiceMemoApp();
  });
})();
</script>
</body>
</html>
