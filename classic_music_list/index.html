<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opus Salon — クラシック音楽 探索・解説＆プレイヤー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>

  .serif{font-family:'Cormorant Garamond','Noto Serif JP',serif}

  header{padding-top:2rem;padding-bottom:1.25rem}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
  h1{font-size:clamp(2.25rem,6vw,3.25rem);color:var(--brass);font-weight:700;line-height:1.1}
  .lead{margin-top:.25rem;font-size:.9rem;color:var(--mute)}
  .inp{width:100%;padding:.75rem 1rem;border-radius:.6rem;outline:0;background:var(--panel);border:1px solid var(--line)}

  #q{margin-top:1.25rem}
  .chips{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.5rem}
  .chip{border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:.35rem 1rem;font-size:.88rem;transition:.15s;white-space:nowrap}
  .chip:hover{color:var(--ink);border-color:var(--brass)}
  .chip.on{background:var(--brass);color:#1a1630;border-color:var(--brass);font-weight:700}
  .chip.fv{border-color:var(--rose);color:var(--rose)}
  .chip.fv.on{background:var(--rose);color:#1a1630;border-color:var(--rose)}
  main{padding-bottom:4rem}
  section{margin-top:2.25rem;scroll-margin-top:1rem}
  h2{font-size:1.6rem;font-weight:700;margin-bottom:.75rem}
  .bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.75rem;margin-bottom:.5rem}
  .bar h2{margin:0}
  .ctrls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .ctrls .inp{width:min(100%,15rem);padding:.5rem .75rem;font-size:.9rem}
  .ctrls select{width:auto}
  #ystat{min-height:1.2rem;margin-bottom:.5rem}
  .grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

  .full{grid-column:1/-1}
  .cw{position:relative;display:flex}
  .cw>.card{flex:1;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;text-align:left;transition:.15s;color:var(--ink)}
  button.card:hover{border-color:var(--brass)}
  .card.sel{box-shadow:0 0 0 2px var(--brass)}
  .star{position:absolute;top:.35rem;right:.4rem;width:34px;height:34px;border-radius:50%;font-size:1.25rem;line-height:1;color:var(--brass)}
  .star.off{color:var(--mute)}
  .star:hover{background:var(--panel2)}
  .cc{display:flex;align-items:center;gap:.75rem;padding:.75rem 2.6rem .75rem .75rem}
  .cc .pt{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--panel2)}
  .cc .ct{min-width:0}
  .cn{font-size:1.1rem;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .wc{display:flex;flex-direction:column;gap:.25rem;padding:1rem 2.6rem 1rem 1rem}
  .wt{font-size:1.1rem;font-weight:700;line-height:1.4}
  .tags{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.4rem}
  .tag{font-size:.75rem;padding:.1rem .5rem;border-radius:.3rem;background:var(--panel2)}
  .tag.b{background:var(--brass);color:#1a1630}
  .tag.s{color:var(--brass)}
  footer{padding-bottom:2.5rem;font-size:.75rem;color:var(--mute)}

  .ld.s{padding:0;font-size:.78rem}.ld.s .spin{width:14px;height:14px;border-width:2px}
  .spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{padding:.75rem;border-radius:.6rem;font-size:.88rem;background:#3a2036;border:1px solid var(--rose)}
  .err button{margin-left:.5rem;text-decoration:underline;color:var(--brass)}
  .ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);padding:1rem;overflow-y:auto}

  .md>section{margin-top:1.5rem}

  .md h4{font-size:1rem;margin-bottom:.5rem}

  .dl{background:var(--panel2);border-radius:.6rem;padding:.9rem 1rem;font-size:.88rem}
  .dl h5{margin:.75rem 0 .25rem;font-size:.82rem;color:var(--rose)}
  .dl ul{padding-left:1.2rem}.dl li{margin:.2rem 0;line-height:1.7}
  .txt{font-size:.9rem;line-height:1.9;max-height:18rem;overflow-y:auto;padding-right:.5rem}
  .txt p+p{margin-top:.75rem}
  a{color:var(--brass)}
  select{width:100%;padding:.5rem .75rem;border-radius:.5rem;background:var(--panel2);border:1px solid var(--line);font-size:.88rem}
  label.l{display:block;font-size:.75rem;color:var(--mute);margin:.5rem 0 .25rem}
  .pl{margin-top:.75rem;background:var(--panel2);border-radius:.8rem;padding:1rem}
  .pl .tn{font-size:.88rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ctl{display:flex;align-items:center;gap:.75rem;margin-top:.75rem}
  .play{width:44px;height:44px;border-radius:50%;background:var(--brass);color:#1a1630;font-weight:700;flex:none}
  .tm{font-size:.75rem;width:2.6rem;font-variant-numeric:tabular-nums}

  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.md,.spin{animation:none}}
</style>
</head>
<body>

<header class="wrap">

</header>

<main class="wrap">

  </section>

      </div>
    </div>
    <div id="ystat" class="sm muted"></div>
    <div id="works" class="grid w"></div>
  </section>
</main>

<footer class="wrap" data-ja="データ: OpenOpus / Wikipedia / Wikidata / Internet Archive（いずれもAPIキー不要）。日本語表記・作曲年・ピアノ難易度・知名度は自動推定を含む目安であり（知名度はOpenOpusの人気・おすすめ指定とWikipediaの言語版数から算出）、不正確な場合があります（「約」は推定）。お気に入りはこのブラウザ内（localStorage）に保存されます。" data-en="Data: OpenOpus / Wikipedia / Wikidata / Internet Archive (no API keys). Years, piano difficulty and fame are estimates and may be inaccurate (fame is derived from OpenOpus popular/recommended flags and the number of Wikipedia language editions) (“c.” = estimated). Favorites are stored in this browser (localStorage)."></footer>

<div id="modal" class="ov hidden" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="md">

    <h3 id="mt" class="serif"></h3>
    <p id="ms" class="sm muted" style="margin-top:.25rem"></p>
    <button id="favBtn" class="chip fv" style="margin-top:.75rem"></button>

    <section><h4 data-ja="ピアノ演奏の難易度" data-en="Piano difficulty"></h4><div id="diff"></div></section>
    <section><h4 data-ja="楽曲の概要・歴史的背景" data-en="Overview & historical background"></h4><div id="wiki"></div></section>
    <section>
      <h4 data-ja="試聴プレイヤー" data-en="Audio player"></h4>
      <div id="arch"></div>
      <div id="player" class="pl hidden">
        <p id="trackName" class="tn"></p>
        <div class="ctl">
          <button id="play" class="play" aria-label="Play">▶</button>
          <span id="cur" class="tm" style="text-align:right">0:00</span>
          <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek">
          <span id="dur" class="tm">0:00</span>
        </div>
        <div class="vol"><span data-ja="音量" data-en="Volume"></span> <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume"></div>
        <audio id="audio" preload="none"></audio>
      </div>
    </section>
  </div>
</div>

  async function wikiFind(host, q) {
    const u = `https://${host}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${enc(q)}&gsrlimit=1&prop=extracts|info&inprop=url&exintro=1&explaintext=1&exsentences=10&format=json&origin=*`;

  }
  async function wikiGet(w, c) {

  audio.addEventListener('error', () => { if (audio.getAttribute('src')) $('trackName').textContent = '⚠ ' + L('このトラックは再生できません。別のトラックをお試しください。', 'This track cannot be played. Try another track.'); });
  $('seek').addEventListener('input', e => { if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration; });
  $('vol').addEventListener('input', e => { audio.volume = +e.target.value; });

  applyStatic(); renderEpochs(); loadComposers();
})();
</script>
</body>
</html>
