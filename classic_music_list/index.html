<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opus Salon — クラシック音楽 探索・解説＆プレイヤー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#12142a;--panel:#1b1e3a;--panel2:#242848;--line:#343964;--ink:#ece8f4;--mute:#9a9bc0;--brass:#d8b36a;--rose:#c77d9a}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.6}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  .hidden{display:none!important}
  .serif{font-family:'Cormorant Garamond','Noto Serif JP',serif}
  .wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
  .muted{color:var(--mute)} .rose{color:var(--rose)} .sm{font-size:.78rem;margin:0}
  h1,h2,h3,h4,p,dl,dd,ul{margin:0}
  header{padding-top:2rem;padding-bottom:1.25rem}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
  h1{font-size:clamp(2.25rem,6vw,3.25rem);color:var(--brass);font-weight:700;line-height:1.1}
  .lead{margin-top:.25rem;font-size:.9rem;color:var(--mute)}
  .inp{width:100%;padding:.75rem 1rem;border-radius:.6rem;outline:0;background:var(--panel);border:1px solid var(--line)}
  .inp:focus{border-color:var(--brass)}
  #q{margin-top:1.25rem}
  .chips{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.5rem}
  .chip{border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:.35rem 1rem;font-size:.88rem;transition:.15s;white-space:nowrap}
  .chip:hover{color:var(--ink);border-color:var(--brass)}
  .chip.on{background:var(--brass);color:#1a1630;border-color:var(--brass);font-weight:700}
  .chip.fv{border-color:var(--rose);color:var(--rose)}
  .chip.fv.on{background:var(--rose);color:#1a1630;border-color:var(--rose)}
  main{padding-bottom:4rem}
  section{margin-top:2.25rem;scroll-margin-top:1rem}
  h2{font-size:1.6rem;font-weight:700;margin-bottom:.75rem}
  .bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.75rem;margin-bottom:.5rem}
  .bar h2{margin:0}
  .ctrls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .ctrls .inp{width:min(100%,15rem);padding:.5rem .75rem;font-size:.9rem}
  .ctrls select{width:auto}
  #ystat{min-height:1.2rem;margin-bottom:.5rem}
  .grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .grid.w{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  .full{grid-column:1/-1}
  .cw{position:relative;display:flex}
  .cw>.card{flex:1;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;text-align:left;transition:.15s;color:var(--ink)}
  button.card:hover{border-color:var(--brass)}
  .card.sel{box-shadow:0 0 0 2px var(--brass)}
  .star{position:absolute;top:.35rem;right:.4rem;width:34px;height:34px;border-radius:50%;font-size:1.25rem;line-height:1;color:var(--brass)}
  .star.off{color:var(--mute)}
  .star:hover{background:var(--panel2)}
  .cc{display:flex;align-items:center;gap:.75rem;padding:.75rem 2.6rem .75rem .75rem}
  .cc .pt{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--panel2)}
  .cc .ct{min-width:0}
  .cn{font-size:1.1rem;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .wc{display:flex;flex-direction:column;gap:.25rem;padding:1rem 2.6rem 1rem 1rem}
  .wt{font-size:1.1rem;font-weight:700;line-height:1.4}
  .tags{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.4rem}
  .tag{font-size:.75rem;padding:.1rem .5rem;border-radius:.3rem;background:var(--panel2)}
  .tag.b{background:var(--brass);color:#1a1630}
  .tag.s{color:var(--brass)}
  footer{padding-bottom:2.5rem;font-size:.75rem;color:var(--mute)}
  .ld{display:flex;align-items:center;gap:.75rem;padding:.75rem 0;font-size:.88rem;color:var(--mute)}
  .ld.s{padding:0;font-size:.78rem}.ld.s .spin{width:14px;height:14px;border-width:2px}
  .spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{padding:.75rem;border-radius:.6rem;font-size:.88rem;background:#3a2036;border:1px solid var(--rose)}
  .err button{margin-left:.5rem;text-decoration:underline;color:var(--brass)}
  .ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);padding:1rem;overflow-y:auto}
  .md{position:relative;max-width:48rem;margin:1rem auto;background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1.5rem;animation:pop .2s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .md>section{margin-top:1.5rem}
  .md h3{font-size:1.8rem;font-weight:700;padding-right:2.5rem;line-height:1.3}
  .md h4{font-size:1rem;margin-bottom:.5rem}
  .x{position:absolute;top:.75rem;right:.75rem;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:var(--mute);font-size:1.3rem;line-height:1}
  .x:hover{color:var(--ink);border-color:var(--brass)}
  .basic{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem}
  .basic div{background:var(--panel2);border-radius:.5rem;padding:.6rem .75rem}
  .basic dt{font-size:.75rem;color:var(--mute)} .basic dd{font-weight:500;font-size:.9rem}
  .stars{font-size:1.5rem;color:var(--brass);letter-spacing:.1em}
  .dl{background:var(--panel2);border-radius:.6rem;padding:.9rem 1rem;font-size:.88rem}
  .dl h5{margin:.75rem 0 .25rem;font-size:.82rem;color:var(--rose)}
  .dl ul{padding-left:1.2rem}.dl li{margin:.2rem 0;line-height:1.7}
  .txt{font-size:.9rem;line-height:1.9;max-height:18rem;overflow-y:auto;padding-right:.5rem}
  .txt p+p{margin-top:.75rem}
  a{color:var(--brass)}
  select{width:100%;padding:.5rem .75rem;border-radius:.5rem;background:var(--panel2);border:1px solid var(--line);font-size:.88rem}
  label.l{display:block;font-size:.75rem;color:var(--mute);margin:.5rem 0 .25rem}
  .pl{margin-top:.75rem;background:var(--panel2);border-radius:.8rem;padding:1rem}
  .pl .tn{font-size:.88rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ctl{display:flex;align-items:center;gap:.75rem;margin-top:.75rem}
  .play{width:44px;height:44px;border-radius:50%;background:var(--brass);color:#1a1630;font-weight:700;flex:none}
  .tm{font-size:.75rem;width:2.6rem;font-variant-numeric:tabular-nums}
  .vol{display:flex;align-items:center;gap:.5rem;margin-top:.75rem;font-size:.75rem;color:var(--mute)}
  input[type=range]{accent-color:var(--brass);flex:1}.vol input{flex:none;width:7rem}
  details.rnd{padding:.9rem 1rem}
  details.rnd summary{cursor:pointer;font-weight:700;color:var(--brass)}
  .rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.75rem;margin:.9rem 0 .5rem;align-items:end}
  .rgrid label{display:flex;flex-direction:column;gap:.25rem;font-size:.78rem;color:var(--mute)}
  .rgrid label.rchk{flex-direction:row;align-items:center;gap:.5rem;color:var(--ink);font-size:.85rem}
  .rgrid label.rchk input{width:18px;height:18px;accent-color:var(--brass)}
  #rList{margin:.4rem 0 0;padding-left:1.4rem;font-size:.85rem;max-height:14rem;overflow-y:auto}
  #rList li{margin:.25rem 0}#rList li.cur{color:var(--brass);font-weight:700}
  .rbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#161935;border-top:1px solid var(--line);padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
  .rbar .rinfo{flex:1;min-width:10rem}.rbar .tn{font-size:.9rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rbar input[type=range]{flex:1;min-width:8rem}
  body.rb{padding-bottom:5.5rem}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.md,.spin{animation:none}}
</style>
</head>
<body>

<header class="wrap">
  <div class="top">
    <h1 class="serif">Opus Salon</h1>
    <button id="langBtn" class="chip" aria-label="Language / 言語">English</button>
  </div>
  <p class="lead" data-ja="時代と作曲家から名曲をたどり、解説を読みながらパブリックドメイン音源を試聴できます。" data-en="Explore masterpieces by era and composer, read about them, and listen to public-domain recordings."></p>
  <input id="q" class="inp" type="search" autocomplete="off" data-phja="作曲家を検索（例: バッハ、モーツァルト、Chopin）" data-phen="Search composers (e.g. Bach, Mozart, Chopin)">
  <div id="epochs" class="chips" role="group" aria-label="Era"></div>
</header>

<main class="wrap">
  <section id="rndSec">
    <details id="rndBox" class="card rnd">
      <summary data-ja="🎲 ランダム再生（停止タイマー・作曲家指定・気分と天気で選曲）" data-en="🎲 Random play (timer, composer, mood & weather)"></summary>
      <div class="rgrid">
        <label><span data-ja="作曲家" data-en="Composer"></span><select id="rSrc"><option value="all">all</option></select></label>
        <label><span data-ja="停止時間" data-en="Stop after"></span><select id="rTime"></select></label>
        <label><span data-ja="気分" data-en="Mood"></span><select id="rMood"></select></label>
        <label><span data-ja="天気" data-en="Weather"></span><select id="rWx"></select></label>
        <button id="rWxBtn" class="chip" data-ja="現在地の天気を取得" data-en="Get weather for my location"></button>
        <label class="rchk"><input type="checkbox" id="rScene" checked><span data-ja="今日の気分・天気に合うリラックス曲だけを流す" data-en="Only play relaxing pieces that fit today’s mood & weather"></span></label>
      </div>
      <p id="rWxMsg" class="sm muted" style="min-height:1.2rem"></p>
      <div class="ctrls" style="margin:.5rem 0">
        <button id="rStart" class="chip on" data-ja="▶ ランダム再生を開始" data-en="▶ Start random play"></button>
        <button id="rNext" class="chip" data-ja="⏭ 次の曲" data-en="⏭ Next"></button>
        <button id="rStop" class="chip" data-ja="■ 停止" data-en="■ Stop"></button>
      </div>
      <p id="rStatus" class="sm" style="min-height:1.2rem"></p>
      <h4 style="margin-top:.75rem;font-size:.95rem" data-ja="再生リスト（同じ曲は再生されません）" data-en="Play list (no repeats)"></h4>
      <ol id="rList"></ol>
    </details>
  </section>
  <section id="compSec">
    <h2 id="ch" class="serif"></h2>
    <div id="composers" class="grid"></div>
  </section>
  <section id="worksSec" class="hidden">
    <div class="bar">
      <h2 id="wh" class="serif"></h2>
      <div class="ctrls">
        <select id="sortSel" aria-label="Sort"></select>
        <input id="wq" class="inp" type="search" data-phja="作品名・ジャンルで絞り込み" data-phen="Filter by title or genre">
      </div>
    </div>
    <div id="ystat" class="sm muted"></div>
    <div id="works" class="grid w"></div>
  </section>
</main>

<footer class="wrap" data-ja="データ: OpenOpus / Wikipedia / Wikidata / Internet Archive（いずれもAPIキー不要）。日本語表記・作曲年・ピアノ難易度・知名度は自動推定を含む目安であり（知名度はOpenOpusの人気・おすすめ指定とWikipediaの言語版数から算出）、不正確な場合があります（「約」は推定）。お気に入りはこのブラウザ内（localStorage）に保存されます。" data-en="Data: OpenOpus / Wikipedia / Wikidata / Internet Archive (no API keys). Years, piano difficulty and fame are estimates and may be inaccurate (fame is derived from OpenOpus popular/recommended flags and the number of Wikipedia language editions) (“c.” = estimated). Favorites are stored in this browser (localStorage)."></footer>

<div id="rbar" class="rbar hidden">
  <div class="rinfo"><p id="rNow" class="tn"></p><p id="rRemain" class="sm muted"></p></div>
  <button id="rPlay" class="play" aria-label="Play/Pause">❚❚</button>
  <button id="rSkip" class="chip" aria-label="Next">⏭</button>
  <button id="rEnd" class="chip" aria-label="Stop">■</button>
  <input id="rSeek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek">
  <audio id="raudio" preload="none"></audio>
</div>

<div id="modal" class="ov hidden" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="md">
    <button id="close" class="x" aria-label="Close">×</button>
    <p id="mc" class="sm rose" style="font-size:.88rem"></p>
    <h3 id="mt" class="serif"></h3>
    <p id="ms" class="sm muted" style="margin-top:.25rem"></p>
    <button id="favBtn" class="chip fv" style="margin-top:.75rem"></button>
    <section><h4 data-ja="基本詳細" data-en="Details"></h4><dl id="basic" class="basic"></dl></section>
    <section><h4 data-ja="ピアノ演奏の難易度" data-en="Piano difficulty"></h4><div id="diff"></div></section>
    <section><h4 data-ja="楽曲の概要・歴史的背景" data-en="Overview & historical background"></h4><div id="wiki"></div></section>
    <section>
      <h4 data-ja="試聴プレイヤー" data-en="Audio player"></h4>
      <div id="arch"></div>
      <div id="player" class="pl hidden">
        <p id="trackName" class="tn"></p>
        <div class="ctl">
          <button id="play" class="play" aria-label="Play">▶</button>
          <span id="cur" class="tm" style="text-align:right">0:00</span>
          <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek">
          <span id="dur" class="tm">0:00</span>
        </div>
        <div class="vol"><span data-ja="音量" data-en="Volume"></span> <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume"></div>
        <audio id="audio" preload="none"></audio>
      </div>
    </section>
  </div>
</div>

<script>

    ['20th Century', '20世紀', '20th Century'], ['Post-War', '戦後', 'Post-War'], ['21st Century', '21世紀', '21st Century']];

  const COUNTRIES = { Germany: 'ドイツ', Austria: 'オーストリア', France: 'フランス', Italy: 'イタリア', Russia: 'ロシア', Poland: 'ポーランド', England: 'イギリス', 'United Kingdom': 'イギリス', UK: 'イギリス', Scotland: 'スコットランド', Ireland: 'アイルランド', 'Czech Republic': 'チェコ', Czechia: 'チェコ', Bohemia: 'ボヘミア', Hungary: 'ハンガリー', Norway: 'ノルウェー', Sweden: 'スウェーデン', Denmark: 'デンマーク', Finland: 'フィンランド', Spain: 'スペイン', Portugal: 'ポルトガル', Netherlands: 'オランダ', Belgium: 'ベルギー', Switzerland: 'スイス', USA: 'アメリカ', 'United States': 'アメリカ', Canada: 'カナダ', Mexico: 'メキシコ', Brazil: 'ブラジル', Argentina: 'アルゼンチン', Cuba: 'キューバ', Ukraine: 'ウクライナ', Romania: 'ルーマニア', Bulgaria: 'ブルガリア', Greece: 'ギリシャ', Croatia: 'クロアチア', Serbia: 'セルビア', Slovakia: 'スロバキア', Slovenia: 'スロベニア', Estonia: 'エストニア', Latvia: 'ラトビア', Lithuania: 'リトアニア', Armenia: 'アルメニア', Georgia: 'ジョージア', Azerbaijan: 'アゼルバイジャン', Australia: 'オーストラリア', Japan: '日本', China: '中国', Korea: '韓国', 'South Korea': '韓国', Israel: 'イスラエル', Turkey: 'トルコ', Venezuela: 'ベネズエラ', Iceland: 'アイスランド', Belarus: 'ベラルーシ' };

    const en = async missJa => {
      let x = await wikiFind('en', `${base} ${c.complete_name || c.name}`), fb = false;

    return r;

  }
  function scoreWork(w, c, p) {
    const t = w.title + ' ' + (w.subtitle || ''), cn = (c.name || '') + ' ' + (c.complete_name || '');
    let s = 0;
    if (BASE_NEG.test(t)) s -= 4;
    if (/Concerto|Symphon|Opera|Mass\b|Requiem/i.test(t) && !p[2].test(t)) s -= 1;
    if (BASE_POS.test(t)) s += 1;
    if (p[2].test(t)) s += 3;
    if (p[3] && p[3].test(cn)) s += 2;
    const km = rawMeta(w).km; if (km) s += /minor/i.test(km[3]) ? p[4] : p[5];
    if (w.genre === 'Keyboard') s += 1;
    return s;
  }

  /* 選曲 */
  async function getWorks(c) {
    const k = String(c.id); if (WK.has(k)) return WK.get(k);
    let ws = [];
    if (!c.custom) {
      ws = store.get('opus.works.' + c.id, null);
      if (!ws) { const j = await jget(`${API}/work/list/composer/${c.id}/genre/all.json`); ws = Array.isArray(j.works) ? j.works : []; }
    }
    ws = mergeCustom(c, ws); ws.forEach(w => WC.set(String(w.id), c)); applyCustomYears(ws); WK.set(k, ws); return ws;
  }
  async function rComposers(src, scene) {
    if (src === 'favC') return favC;
    if (src.startsWith('c:')) { const c = RC.get(src.slice(2)); return c ? [c] : []; }
    let list = await popComposers();
    if (scene) { const f = list.filter(c => RELAX_COMP.test(c.name + ' ' + (c.complete_name || ''))); if (f.length) list = f; }
    return list;
  }
  async function findAudio(w, c) {
    const t = w.title.replace(/\(.*?\)/g, '').replace(/["“”]/g, '').split(/ in |,/)[0].trim(), op = rawMeta(w).opus;
    for (const q of (op ? [`${c.name} ${t} ${op}`, `${c.name} ${t}`] : [`${c.name} ${t}`])) {
      let docs = []; try { docs = await archSearch(q); } catch (e) { continue; }
      for (const d of docs.slice(0, 4)) {
        try {
          const j = await jget(`https://archive.org/metadata/${enc(d.identifier)}`);
          for (const f of (j.files || []).filter(f => /\.mp3$/i.test(f.name))) {
            const url = `https://archive.org/download/${enc(d.identifier)}/${f.name.split('/').map(enc).join('/')}`;
            if (!R.urls.has(url)) return { url, rec: d.title || d.identifier };
          }
        } catch (e) { /* 次の候補へ */ }
      }
    }
    return null;
  }
  async function pickNext() {
    const src = $('rSrc').value || 'all', scene = $('rScene').checked, p = PROF[profileKey()];
    let sawAny = false;
    for (let attempt = 0; attempt < 16 && R.on; attempt++) {
      let c, w;
      if (src === 'favW') {
        const pool = favW.filter(x => !R.played.has(wkey(x.w, x.c)) && !R.bad.has(wkey(x.w, x.c)));
        if (!pool.length) return sawAny ? 'fail' : 'done';
        const x = pool[Math.random() * pool.length | 0]; c = x.c; w = x.w;
      } else {
        const comps = await rComposers(src, scene);
        if (!comps.length) return 'none';
        c = comps[Math.random() * comps.length | 0];
        let ws; try { ws = await getWorks(c); } catch (e) { continue; }
        let cand = ws.filter(x => !R.played.has(wkey(x, c)) && !R.bad.has(wkey(x, c)));
        if (scene) cand = cand.filter(x => scoreWork(x, c, p) >= TH);
        if (!cand.length) { if (src.startsWith('c:')) return sawAny ? 'fail' : (R.played.size ? 'done' : 'none'); continue; }
        w = cand[Math.random() * cand.length | 0];
      }
      sawAny = true;
      const au = await findAudio(w, c);
      if (!R.on) return null;
      if (!au) { R.bad.add(wkey(w, c)); continue; }
      R.played.add(wkey(w, c)); R.urls.add(au.url);
      return { w, c, au, prof: scene ? profileKey() : '' };
    }
    return R.on ? 'fail' : null;
  }
  async function playNext() {
    if (!R.on || R.busy) return;
    R.busy = true; $('rNow').textContent = L('選曲中…', 'Choosing a piece…');
    let p = null; try { p = await pickNext(); } catch (e) { p = 'fail'; }
    R.busy = false;
    if (!R.on) return;
    if (typeof p === 'string' || !p) return endRandom(p || 'fail');
    R.list.push(p); renderRList();
    $('rNow').textContent = `${wTitle(p.w)} — ${cshort(p.c)}`;
    ra.src = p.au.url; ra.volume = BASEVOL;
    try { await ra.play(); } catch (e) { if (e.name === 'NotAllowedError') setRStatus(esc(L('ブラウザが自動再生をブロックしました。▶ ボタンを押してください。', 'Autoplay was blocked. Press ▶.'))); }
  }
  function renderRList() {
    $('rList').innerHTML = R.list.map((p, i) => `<li class="${R.on && i === R.list.length - 1 ? 'cur' : ''}">${esc(wTitle(p.w))} — ${esc(cshort(p.c))}（${esc(ydisp(Y[p.w.id]))}） <span class="sm muted">${esc(p.au.rec)}</span></li>`).join('');
    const li = $('rList').lastElementChild; if (li && R.on) li.scrollIntoView({ block: 'nearest' });
  }
  function rTick() {
    const left = (R.endAt - Date.now()) / 1000;
    if (left <= 0) return endRandom('timeup');
    $('rRemain').textContent = L('停止まで ', 'Stops in ') + hms(left);
  }
  function endRandom(reason) {
    const was = R.on; R.on = false; R.busy = false; clearInterval(R.tick);
    const msgs = { timeup: ['設定した停止時間になったため、再生を終了しました。', 'The stop time has been reached; playback ended.'], done: ['条件に合う曲をすべて再生しました（同じ曲は流していません）。', 'All matching pieces have been played (no repeats).'], none: ['条件に合う曲が見つかりませんでした。シーン選曲をオフにするか、作曲家・気分を変えてください。', 'No matching pieces. Turn off scene filtering or change the composer/mood.'], fail: ['再生できる音源が見つかりませんでした。作曲家や条件を変えてお試しください。', 'No playable recording was found. Try another composer or setting.'], error: ['再生エラーが続いたため停止しました。', 'Stopped after repeated playback errors.'], user: ['停止しました。', 'Stopped.'] };
    const m = msgs[reason] || msgs.user; setRStatus(esc(L(m[0], m[1])));
    if (!was) return;
    let n = 10; const f = setInterval(() => {
      n--; ra.volume = Math.max(0, BASEVOL * n / 10);
      if (n <= 0) { clearInterval(f); ra.pause(); ra.removeAttribute('src'); ra.load(); ra.volume = BASEVOL; if (!R.on) { $('rbar').classList.add('hidden'); document.body.classList.remove('rb'); } }
    }, reason === 'timeup' ? 300 : 40);
    renderRList();
  }
  function startRandom() {
    if (R.on) endRandom('user');
    stopPlayer(); ra.volume = BASEVOL;
    Object.assign(R, { on: true, busy: false, endAt: Date.now() + (+$('rTime').value) * 60000, played: new Set(), urls: new Set(), bad: new Set(), list: [], errs: 0 });
    const scene = $('rScene').checked, p = PROF[profileKey()];
    setRStatus(esc(scene ? L('選曲シーン: ', 'Scene: ') + L(p[0], p[1]) : L('シーン選曲: オフ（すべての曲から）', 'Scene filtering: off (any piece)')));
    $('rbar').classList.remove('hidden'); document.body.classList.add('rb');
    clearInterval(R.tick); R.tick = setInterval(rTick, 1000); rTick(); renderRList(); playNext();
  }
  $('rStart').onclick = startRandom;
  $('rNext').onclick = $('rSkip').onclick = () => { if (R.on && !R.busy) { ra.pause(); playNext(); } };
  $('rStop').onclick = $('rEnd').onclick = () => endRandom('user');
  $('rPlay').onclick = () => { if (!ra.getAttribute('src')) return; ra.paused ? ra.play().catch(() => {}) : ra.pause(); };
  ra.addEventListener('play', () => { $('rPlay').textContent = '❚❚'; stopPlayer(); });
  ra.addEventListener('pause', () => { $('rPlay').textContent = '▶'; });
  ra.addEventListener('playing', () => { R.errs = 0; });
  ra.addEventListener('ended', () => { if (R.on) playNext(); });
  ra.addEventListener('error', () => { if (!R.on || !ra.getAttribute('src')) return; R.errs++; if (R.errs >= 6) endRandom('error'); else playNext(); });
  ra.addEventListener('timeupdate', () => { if (ra.duration) $('rSeek').value = (ra.currentTime / ra.duration) * 100; });
  $('rSeek').addEventListener('input', e => { if (ra.duration) ra.currentTime = (e.target.value / 100) * ra.duration; });
  audio.addEventListener('play', () => { if (R.on && !ra.paused) ra.pause(); });

  applyStatic(); renderEpochs(); loadComposers();
})();
</script>
</body>
</html>
