<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opus Salon — クラシック音楽 探索・解説＆プレイヤー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#12142a;--panel:#1b1e3a;--panel2:#242848;--line:#343964;--ink:#ece8f4;--mute:#9a9bc0;--brass:#d8b36a;--rose:#c77d9a}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.6}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  .hidden{display:none!important}
  .serif{font-family:'Cormorant Garamond','Noto Serif JP',serif}
  .wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
  .muted{color:var(--mute)} .rose{color:var(--rose)} .sm{font-size:.78rem;margin:0}
  h1,h2,h3,h4,p,dl,dd{margin:0}
  header{padding-top:2rem;padding-bottom:1.25rem}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
  h1{font-size:clamp(2.25rem,6vw,3.25rem);color:var(--brass);font-weight:700;line-height:1.1}
  .lead{margin-top:.25rem;font-size:.9rem;color:var(--mute)}
  .inp{width:100%;padding:.75rem 1rem;border-radius:.6rem;outline:0;background:var(--panel);border:1px solid var(--line)}
  .inp:focus{border-color:var(--brass)}
  #q{margin-top:1.25rem}
  .chips{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.5rem}
  .chip{border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:.35rem 1rem;font-size:.88rem;transition:.15s;white-space:nowrap}
  .chip:hover{color:var(--ink);border-color:var(--brass)}
  .chip.on{background:var(--brass);color:#1a1630;border-color:var(--brass);font-weight:700}
  main{padding-bottom:4rem}
  section{margin-top:2.25rem;scroll-margin-top:1rem}
  h2{font-size:1.6rem;font-weight:700;margin-bottom:.75rem}
  .bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
  .bar h2{margin:0}.bar .inp{width:min(100%,18rem);padding:.5rem .75rem;font-size:.9rem}
  .grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .grid.w{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  .full{grid-column:1/-1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;text-align:left;transition:.15s;color:var(--ink)}
  button.card:hover{border-color:var(--brass)}
  .card.sel{box-shadow:0 0 0 2px var(--brass)}
  .cc{display:flex;align-items:center;gap:.75rem;padding:.75rem}
  .cc .pt{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--panel2)}
  .cc .ct{min-width:0}
  .cn{font-size:1.1rem;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .wc{display:flex;flex-direction:column;gap:.25rem;padding:1rem}
  .wt{font-size:1.1rem;font-weight:700;line-height:1.4}
  .tags{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.4rem}
  .tag{font-size:.75rem;padding:.1rem .5rem;border-radius:.3rem;background:var(--panel2)}
  .tag.b{background:var(--brass);color:#1a1630}
  footer{padding-bottom:2.5rem;font-size:.75rem;color:var(--mute)}
  .ld{display:flex;align-items:center;gap:.75rem;padding:.75rem 0;font-size:.88rem;color:var(--mute)}
  .spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{padding:.75rem;border-radius:.6rem;font-size:.88rem;background:#3a2036;border:1px solid var(--rose)}
  .err button{margin-left:.5rem;text-decoration:underline;color:var(--brass)}
  .ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);padding:1rem;overflow-y:auto}
  .md{position:relative;max-width:48rem;margin:1rem auto;background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1.5rem;animation:pop .2s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .md>section{margin-top:1.5rem}
  .md h3{font-size:1.8rem;font-weight:700;padding-right:2.5rem;line-height:1.3}
  .md h4{font-size:1rem;margin-bottom:.5rem}
  .x{position:absolute;top:.75rem;right:.75rem;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:var(--mute);font-size:1.3rem;line-height:1}
  .x:hover{color:var(--ink);border-color:var(--brass)}
  .basic{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem}
  .basic div{background:var(--panel2);border-radius:.5rem;padding:.6rem .75rem}
  .basic dt{font-size:.75rem;color:var(--mute)} .basic dd{font-weight:500;font-size:.9rem}
  .txt{font-size:.9rem;line-height:1.9;max-height:18rem;overflow-y:auto;padding-right:.5rem}
  .txt p+p{margin-top:.75rem}
  a{color:var(--brass)}
  select{width:100%;padding:.5rem .75rem;border-radius:.5rem;background:var(--panel2);border:1px solid var(--line);font-size:.88rem}
  label.l{display:block;font-size:.75rem;color:var(--mute);margin:.5rem 0 .25rem}
  .pl{margin-top:.75rem;background:var(--panel2);border-radius:.8rem;padding:1rem}
  .pl .tn{font-size:.88rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ctl{display:flex;align-items:center;gap:.75rem;margin-top:.75rem}
  .play{width:44px;height:44px;border-radius:50%;background:var(--brass);color:#1a1630;font-weight:700;flex:none}
  .tm{font-size:.75rem;width:2.6rem;font-variant-numeric:tabular-nums}
  .vol{display:flex;align-items:center;gap:.5rem;margin-top:.75rem;font-size:.75rem;color:var(--mute)}
  input[type=range]{accent-color:var(--brass);flex:1}.vol input{flex:none;width:7rem}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.md,.spin{animation:none}}
</style>
</head>
<body>

<header class="wrap">
  <div class="top">
    <h1 class="serif">Opus Salon</h1>
    <button id="langBtn" class="chip" aria-label="Language / 言語">English</button>
  </div>
  <p class="lead" data-ja="時代と作曲家から名曲をたどり、解説を読みながらパブリックドメイン音源を試聴できます。" data-en="Explore masterpieces by era and composer, read about them, and listen to public-domain recordings."></p>
  <input id="q" class="inp" type="search" autocomplete="off" data-phja="作曲家を検索（例: バッハ、モーツァルト、Chopin）" data-phen="Search composers (e.g. Bach, Mozart, Chopin)">
  <div id="epochs" class="chips" role="group" aria-label="Era"></div>
</header>

<main class="wrap">
  <section>
    <h2 class="serif" data-ja="作曲家" data-en="Composers"></h2>
    <div id="composers" class="grid"></div>
  </section>
  <section id="worksSec" class="hidden">
    <div class="bar">
      <h2 id="wh" class="serif"></h2>
      <input id="wq" class="inp" type="search" data-phja="作品名・ジャンルで絞り込み" data-phen="Filter by title or genre">
    </div>
    <div id="works" class="grid w"></div>
  </section>
</main>

<footer class="wrap" data-ja="データ: OpenOpus / Wikipedia / Internet Archive（いずれもAPIキー不要）。作品名・作曲家名の日本語表記は自動変換のため、一部は英語のまま、または不正確な場合があります。音源は検索結果に依存し、曲名と一致しないことがあります。" data-en="Data: OpenOpus / Wikipedia / Internet Archive (no API keys). Recordings depend on search results and may not match the work exactly."></footer>

<div id="modal" class="ov hidden" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="md">
    <button id="close" class="x" aria-label="Close">×</button>
    <p id="mc" class="sm rose" style="font-size:.88rem"></p>
    <h3 id="mt" class="serif"></h3>
    <p id="ms" class="sm muted" style="margin-top:.25rem"></p>
    <section><h4 data-ja="基本詳細" data-en="Details"></h4><dl id="basic" class="basic"></dl></section>
    <section><h4 data-ja="楽曲の概要・歴史的背景" data-en="Overview & historical background"></h4><div id="wiki"></div></section>
    <section>
      <h4 data-ja="試聴プレイヤー" data-en="Audio player"></h4>
      <div id="arch"></div>
      <div id="player" class="pl hidden">
        <p id="trackName" class="tn"></p>
        <div class="ctl">
          <button id="play" class="play" aria-label="Play">▶</button>
          <span id="cur" class="tm" style="text-align:right">0:00</span>
          <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek">
          <span id="dur" class="tm">0:00</span>
        </div>
        <div class="vol"><span data-ja="音量" data-en="Volume"></span> <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume"></div>
        <audio id="audio" preload="none"></audio>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  const API = 'https://api.openopus.org';
  const EPOCHS = [['', '人気', 'Popular'], ['Medieval', '中世', 'Medieval'], ['Renaissance', 'ルネサンス', 'Renaissance'], ['Baroque', 'バロック', 'Baroque'],
    ['Classical', '古典派', 'Classical'], ['Early Romantic', '初期ロマン派', 'Early Romantic'], ['Romantic', 'ロマン派', 'Romantic'],
    ['20th Century', '20世紀', '20th Century'], ['Post-War', '戦後', 'Post-War'], ['21st Century', '21世紀', '21st Century']];
  const GENRES = { Keyboard: '鍵盤楽曲', Chamber: '室内楽', Orchestral: '管弦楽', Stage: '舞台作品', Vocal: '声楽', Popular: '人気曲', Recommended: 'おすすめ' };
  const COUNTRIES = { Germany: 'ドイツ', Austria: 'オーストリア', France: 'フランス', Italy: 'イタリア', Russia: 'ロシア', Poland: 'ポーランド', England: 'イギリス', 'United Kingdom': 'イギリス', UK: 'イギリス', Scotland: 'スコットランド', Ireland: 'アイルランド', 'Czech Republic': 'チェコ', Czechia: 'チェコ', Bohemia: 'ボヘミア', Hungary: 'ハンガリー', Norway: 'ノルウェー', Sweden: 'スウェーデン', Denmark: 'デンマーク', Finland: 'フィンランド', Spain: 'スペイン', Portugal: 'ポルトガル', Netherlands: 'オランダ', Belgium: 'ベルギー', Switzerland: 'スイス', USA: 'アメリカ', 'United States': 'アメリカ', Canada: 'カナダ', Mexico: 'メキシコ', Brazil: 'ブラジル', Argentina: 'アルゼンチン', Cuba: 'キューバ', Ukraine: 'ウクライナ', Romania: 'ルーマニア', Bulgaria: 'ブルガリア', Greece: 'ギリシャ', Croatia: 'クロアチア', Serbia: 'セルビア', Slovakia: 'スロバキア', Slovenia: 'スロベニア', Estonia: 'エストニア', Latvia: 'ラトビア', Lithuania: 'リトアニア', Armenia: 'アルメニア', Georgia: 'ジョージア', Azerbaijan: 'アゼルバイジャン', Australia: 'オーストラリア', Japan: '日本', China: '中国', Korea: '韓国', 'South Korea': '韓国', Israel: 'イスラエル', Turkey: 'トルコ', Venezuela: 'ベネズエラ', Iceland: 'アイスランド', Belarus: 'ベラルーシ' };
  const WORDS = [['Symphonies','交響曲'],['Symphony','交響曲'],['Concertos','協奏曲'],['Concerto','協奏曲'],['Concertino','小協奏曲'],['Sonatas','ソナタ'],['Sonata','ソナタ'],['Sonatina','ソナチネ'],['Suites','組曲'],['Suite','組曲'],['Overture','序曲'],['Quartets','四重奏曲'],['Quartet','四重奏曲'],['Quintet','五重奏曲'],['Sextet','六重奏曲'],['Septet','七重奏曲'],['Octet','八重奏曲'],['Trios','三重奏曲'],['Trio','三重奏曲'],['Duo','二重奏曲'],['Mass','ミサ曲'],['Requiem','レクイエム'],['Opera','オペラ'],['Ballet','バレエ'],['Preludes','前奏曲'],['Prelude','前奏曲'],['Fugue','フーガ'],['Fugues','フーガ'],['Etudes','練習曲'],['Études','練習曲'],['Etude','練習曲'],['Étude','練習曲'],['Nocturnes','夜想曲'],['Nocturne','夜想曲'],['Waltzes','ワルツ'],['Waltz','ワルツ'],['Polonaise','ポロネーズ'],['Mazurkas','マズルカ'],['Mazurka','マズルカ'],['Ballade','バラード'],['Scherzo','スケルツォ'],['Rhapsody','狂詩曲'],['Fantasy','幻想曲'],['Fantasia','幻想曲'],['Variations','変奏曲'],['Variation','変奏曲'],['Cantata','カンタータ'],['Oratorio','オラトリオ'],['Passion','受難曲'],['Magnificat','マニフィカト'],['Minuet','メヌエット'],['Serenade','セレナーデ'],['Divertimento','ディヴェルティメント'],['Impromptus','即興曲'],['Impromptu','即興曲'],['Rondo','ロンド'],['Toccata','トッカータ'],['Partita','パルティータ'],['Partitas','パルティータ'],['Aria','アリア'],['Songs','歌曲'],['Song','歌曲'],['Lieder','歌曲'],['Piano','ピアノ'],['Violin','ヴァイオリン'],['Viola','ヴィオラ'],['Cello','チェロ'],['Flute','フルート'],['Clarinet','クラリネット'],['Oboe','オーボエ'],['Bassoon','ファゴット'],['Horn','ホルン'],['Trumpet','トランペット'],['Organ','オルガン'],['Harpsichord','チェンバロ'],['Guitar','ギター'],['Harp','ハープ'],['String','弦楽'],['Strings','弦楽'],['Orchestra','管弦楽'],['Orchestral','管弦楽'],['Chamber','室内楽'],['Choral','合唱'],['Brandenburg','ブランデンブルク'],['Goldberg','ゴルトベルク'],['Moonlight','月光'],['Appassionata','熱情'],['Pathétique','悲愴'],['Pathetique','悲愴'],['Eroica','英雄'],['Pastoral','田園'],['Emperor','皇帝'],['Spring','春'],['Winter','冬'],['Summer','夏'],['Autumn','秋'],['Jupiter','ジュピター'],['Surprise','驚愕'],['Clock','時計'],['Unfinished','未完成'],['Italian','イタリア'],['Scottish','スコットランド'],['Reformation','宗教改革'],['Rhenish','ライン'],['Trout','ます'],['Kreutzer','クロイツェル'],['Waldstein','ワルトシュタイン'],['Hammerklavier','ハンマークラヴィーア'],['Great','ザ・グレイト'],['Seasons','四季'],['Complete','全集'],['Works','作品集'],['and','と'],['for','—']]
    .sort((a, b) => b[0].length - a[0].length).map(([e, j]) => [new RegExp('(?<![A-Za-z])' + e + '(?![A-Za-z])', 'gi'), j]);
  const KEYL = { C: 'ハ', D: 'ニ', E: 'ホ', F: 'ヘ', G: 'ト', A: 'イ', B: 'ロ' };
  const KEYRE = /\b([A-G])(?:[- ]?(sharp|flat))? (major|minor)\b/i;
  const keyJa = (k, a, m) => (a ? (a.toLowerCase() === 'sharp' ? '嬰' : '変') : '') + KEYL[k.toUpperCase()] + (m.toLowerCase() === 'major' ? '長調' : '短調');

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const enc = encodeURIComponent;
  let lang = 'ja'; try { if (localStorage.getItem('lang') === 'en') lang = 'en'; } catch (e) {}
  const L = (j, e) => lang === 'ja' ? j : e;
  const tx = (j, e) => `<span data-ja="${esc(j)}" data-en="${esc(e)}">${esc(L(j, e))}</span>`;
  const spinner = (j, e) => `<div class="ld"><div class="spin"></div>${tx(j, e)}</div>`;
  const errBox = (j, e, det, retry) => `<div class="err">${tx(j, e)}${det ? ` (${esc(det)})` : ''}${retry ? `<button data-retry="${retry}">${tx('再試行', 'Retry')}</button>` : ''}</div>`;
  async function jget(u, ms = 15000) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(u, { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) { throw new Error(e.name === 'AbortError' ? L('応答がタイムアウトしました', 'Request timed out') : e.message); }
    finally { clearTimeout(t); }
  }
  const fmt = t => (isFinite(t) ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '0:00');
  const yr = s => String(s || '').slice(0, 4);

  /* ---------- 日本語化ヘルパー ---------- */
  const JA = {}; // composer id -> 日本語名（'' = 見つからず）
  async function ensureJa(list) {
    const need = list.filter(c => !(c.id in JA));
    for (let i = 0; i < need.length; i += 40) {
      const chunk = need.slice(i, i + 40), names = chunk.map(c => c.complete_name || c.name);
      try {
        const j = await jget(`https://en.wikipedia.org/w/api.php?action=query&prop=langlinks&lllang=ja&lllimit=500&redirects=1&formatversion=2&format=json&origin=*&titles=${enc(names.join('|'))}`);
        const q = j.query || {}, norm = {}, red = {}, ja = {};
        (q.normalized || []).forEach(x => norm[x.from] = x.to);
        (q.redirects || []).forEach(x => red[x.from] = x.to);
        (q.pages || []).forEach(p => { if (p.langlinks && p.langlinks[0]) ja[p.title] = p.langlinks[0].title; });
        chunk.forEach((c, k) => { let t = names[k]; t = norm[t] || t; t = red[t] || t; JA[c.id] = (ja[t] || '').replace(/\s*\(.*?\)\s*$/, ''); });
      } catch (e) { chunk.forEach(c => { JA[c.id] = ''; }); }
    }
  }
  const cshort = c => lang === 'ja' ? (JA[c.id] || c.name) : c.name;
  const cfull = c => lang === 'ja' ? (JA[c.id] || c.complete_name || c.name) : (c.complete_name || c.name);
  const epochLabel = k => { const x = EPOCHS.find(v => v[0] === k); return x ? L(x[1], x[2]) : k; };
  const genreLabel = g => L(GENRES[g] || g, g);
  const countryLabel = c => L(COUNTRIES[c] || c, c);
  function jaTitle(s) {
    if (!s) return '';
    let r = s.replace(/\bNos?\.?\s*(\d+)/gi, '第$1番').replace(/\b[Oo]p\.?\s*(\d+)/g, '作品$1');
    WORDS.forEach(([re, j]) => { r = r.replace(re, j); });
    r = r.replace(/,\s*/g, ' ').replace(/([\u3040-\u30ff\u4e00-\u9fff])\s+(?=[\u3040-\u30ff\u4e00-\u9fff])/g, '$1');
    r = r.replace(/\bin ([A-G](?:[- ]?(?:sharp|flat))? (?:major|minor))\b/gi, (m, k) => { const mm = k.match(KEYRE); return mm ? ' ' + keyJa(mm[1], mm[2], mm[3]) : m; });
    r = r.replace(/"([^"]+)"/g, '「$1」').replace(/\s+/g, ' ').trim();
    return r;
  }
  const wTitle = w => L(jaTitle(w.title), w.title);
  const wSub = w => w.subtitle ? L(jaTitle(w.subtitle), w.subtitle) : '';
  function meta(w) {
    const s = w.title + ' ' + (w.subtitle || '');
    const opus = (s.match(/\b(Op\.?\s?\d+[a-z]?(?:\s?(?:No|Nr)\.?\s?\d+)?|BWV\s?\d+[a-z]?|K\.?\s?\d+[a-z]?|D\.?\s?\d+[a-z]?|Hob\.?\s?[IVX]+[:/]\s?\w+|RV\s?\d+|WoO\s?\d+|HWV\s?\d+)/) || [])[1] || '';
    const km = s.match(/\bin ([A-G])(?:[- ]?(sharp|flat))? (major|minor)\b/i);
    const o = opus.replace(/\s+/g, ' ');
    return { opus: lang === 'ja' ? o.replace(/^Op\.?\s?/i, '作品 ') : o, key: km ? L(keyJa(km[1], km[2], km[3]), `${km[1].toUpperCase()}${km[2] ? '-' + km[2].toLowerCase() : ''} ${km[3].toLowerCase()}`) : '' };
  }

  let epoch = '', composers = [], current = null, works = [], timer, listTok = 0, workTok = 0, modalTok = 0, wikiTok = 0, curW = null, allP = null;
  const wikiCache = new Map();

  /* ---------- 言語切替 ---------- */
  function applyStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-ja]').forEach(e => { e.textContent = e.dataset[lang]; });
    document.querySelectorAll('[data-phja]').forEach(e => { e.placeholder = lang === 'ja' ? e.dataset.phja : e.dataset.phen; });
    $('langBtn').textContent = lang === 'ja' ? 'English' : '日本語';
    $('close').setAttribute('aria-label', L('閉じる', 'Close'));
    $('seek').setAttribute('aria-label', L('シークバー', 'Seek')); $('vol').setAttribute('aria-label', L('音量', 'Volume'));
    document.title = L('Opus Salon — クラシック音楽 探索・解説＆プレイヤー', 'Opus Salon — Classical Music Explorer & Player');
  }
  $('langBtn').onclick = async () => {
    lang = lang === 'ja' ? 'en' : 'ja';
    try { localStorage.setItem('lang', lang); } catch (e) {}
    applyStatic(); renderEpochs();
    if (lang === 'ja') await ensureJa(current ? composers.concat(current) : composers);
    renderComposers($('q').value.trim());
    if (current) { updateWorksTitle(); renderWorks(); }
    if (!$('modal').classList.contains('hidden') && curW) { fillModal(); loadWiki(); }
  };

  /* ---------- 時代チップ ---------- */
  function renderEpochs() {
    $('epochs').innerHTML = EPOCHS.map(([k, j, e]) => `<button class="chip ${k === epoch ? 'on' : ''}" data-e="${k}">${L(j, e)}</button>`).join('');
  }
  $('epochs').addEventListener('click', e => {
    const b = e.target.closest('[data-e]'); if (!b) return;
    epoch = b.dataset.e; renderEpochs(); loadComposers();
  });
  $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(loadComposers, 350); });

  /* ---------- 作曲家 ---------- */
  function allComposers() {
    if (!allP) allP = Promise.all(EPOCHS.slice(1).map(([k]) => jget(`${API}/composer/list/epoch/${enc(k)}.json`).then(j => j.composers || [])))
      .then(a => { const m = new Map(); a.flat().forEach(c => m.set(c.id, c)); return [...m.values()]; })
      .catch(e => { allP = null; throw e; });
    return allP;
  }
  async function loadComposers() {
    const tok = ++listTok, q = $('q').value.trim(), box = $('composers');
    box.innerHTML = `<div class="full">${spinner('作曲家を読み込み中…', 'Loading composers…')}</div>`;
    try {
      let list;
      if (/[^\x00-\x7F]/.test(q)) {
        list = await allComposers(); await ensureJa(list);
        const n = q.toLowerCase();
        list = list.filter(c => (JA[c.id] || '').toLowerCase().includes(n) || (c.complete_name || '').toLowerCase().includes(n));
      } else {
        const url = q.length >= 2 ? `${API}/composer/list/search/${enc(q)}.json` : epoch ? `${API}/composer/list/epoch/${enc(epoch)}.json` : `${API}/composer/list/pop.json`;
        const j = await jget(url);
        if (!Array.isArray(j.composers)) throw new Error('invalid data');
        list = j.composers;
      }
      if (tok !== listTok) return;
      composers = list.filter(c => !epoch || c.epoch === epoch);
      if (lang === 'ja') await ensureJa(composers);
      if (tok !== listTok) return;
      renderComposers(q);
    } catch (e) {
      if (tok !== listTok) return;
      box.innerHTML = `<div class="full">${errBox('作曲家一覧を取得できませんでした。通信状況を確認してください。', 'Could not load composers. Check your connection.', e.message, 'composers')}</div>`;
    }
  }
  function renderComposers(q) {
    const box = $('composers');
    if (!composers.length) { box.innerHTML = `<p class="full muted" style="font-size:.9rem">${q ? tx(`「${q}」に一致する作曲家が見つかりません。`, `No composers match "${q}".`) : tx('この時代の作曲家が見つかりません。', 'No composers found for this era.')}</p>`; return; }
    box.innerHTML = composers.map((c, i) => `
      <button data-i="${i}" class="card cc ${current && current.id === c.id ? 'sel' : ''}">
        <img class="pt" src="${esc(c.portrait)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="ct">
          <p class="cn serif">${esc(cshort(c))}</p>
          <p class="sm muted">${esc(yr(c.birth))}–${esc(yr(c.death))}</p>
          <p class="sm rose">${esc(epochLabel(c.epoch))}・${esc(countryLabel(c.country || ''))}</p>
        </div>
      </button>`).join('');
  }
  $('composers').addEventListener('click', e => {
    if (e.target.closest('[data-retry]')) return loadComposers();
    const b = e.target.closest('[data-i]'); if (b) selectComposer(composers[+b.dataset.i]);
  });

  /* ---------- 作品 ---------- */
  const updateWorksTitle = () => { $('wh').textContent = current ? L(`${cfull(current)} の作品`, `Works by ${cfull(current)}`) : ''; };
  async function selectComposer(c) {
    current = c; renderComposers($('q').value.trim());
    const tok = ++workTok, sec = $('worksSec'), box = $('works');
    sec.classList.remove('hidden'); $('wq').value = ''; updateWorksTitle();
    box.innerHTML = `<div class="full">${spinner('作品を読み込み中…', 'Loading works…')}</div>`;
    sec.scrollIntoView({ block: 'start' });
    try {
      const j = await jget(`${API}/work/list/composer/${c.id}/genre/all.json`);
      if (tok !== workTok) return;
      if (!Array.isArray(j.works)) throw new Error('invalid data');
      works = j.works.slice().sort((a, b) => (+b.recommended || 0) - (+a.recommended || 0) || (+b.popular || 0) - (+a.popular || 0));
      renderWorks();
    } catch (e) {
      if (tok !== workTok) return;
      box.innerHTML = `<div class="full">${errBox('作品リストを取得できませんでした。', 'Could not load works.', e.message, 'works')}</div>`;
    }
  }
  function renderWorks() {
    const q = $('wq').value.trim().toLowerCase(), box = $('works');
    const list = works.filter(w => !q || [w.title, w.subtitle, w.genre, w.searchterms, jaTitle(w.title), jaTitle(w.subtitle), GENRES[w.genre]].join(' ').toLowerCase().includes(q));
    if (!list.length) { box.innerHTML = `<p class="full muted" style="font-size:.9rem">${tx('条件に合う作品がありません。', 'No matching works.')}</p>`; return; }
    box.innerHTML = list.slice(0, 120).map(w => {
      const m = meta(w);
      return `<button data-w="${esc(w.id)}" class="card wc">
        <span class="wt serif">${esc(wTitle(w))}</span>
        ${w.subtitle ? `<span class="sm muted">${esc(wSub(w))}</span>` : ''}
        <span class="tags">
          <span class="tag rose">${esc(genreLabel(w.genre))}</span>
          ${m.opus ? `<span class="tag">${esc(m.opus)}</span>` : ''}
          ${m.key ? `<span class="tag">${esc(m.key)}</span>` : ''}
          ${+w.recommended ? `<span class="tag b">${esc(L('おすすめ', 'Recommended'))}</span>` : ''}
        </span></button>`;
    }).join('') + (list.length > 120 ? `<p class="full sm muted">${tx('上位120件を表示中。絞り込み検索をご利用ください。', 'Showing the first 120. Use the filter to narrow down.')}</p>` : '');
  }
  $('wq').addEventListener('input', renderWorks);
  $('works').addEventListener('click', e => {
    if (e.target.closest('[data-retry]') && current) return selectComposer(current);
    const b = e.target.closest('[data-w]'); if (!b) return;
    const w = works.find(x => String(x.id) === b.dataset.w); if (w) openModal(w, current);
  });

  /* ---------- モーダル ---------- */
  const audio = $('audio'); let tracks = [], tIdx = 0;
  function fillModal() {
    const w = curW, c = current, m = meta(w);
    $('mc').textContent = `${cfull(c)}（${epochLabel(c.epoch)}）`;
    $('mt').textContent = wTitle(w);
    $('ms').textContent = lang === 'ja' ? [wSub(w), '原題: ' + w.title].filter(Boolean).join(' ／ ') : (w.subtitle || '');
    const none = L('（情報なし）', '(n/a)');
    const rows = [[L('作曲家', 'Composer'), cfull(c)], [L('時代', 'Era'), epochLabel(c.epoch)], [L('ジャンル', 'Genre'), genreLabel(w.genre)], [L('作品番号', 'Catalog no.'), m.opus || none], [L('調性', 'Key'), m.key || none], [L('生没年', 'Years'), `${yr(c.birth)}–${yr(c.death)}`]];
    $('basic').innerHTML = rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
  }
  function openModal(w, c) {
    const tok = ++modalTok; curW = w;
    fillModal();
    $('arch').innerHTML = spinner('Internet Archiveで音源を検索中…', 'Searching Internet Archive…');
    stopPlayer(); $('player').classList.add('hidden');
    $('modal').classList.remove('hidden'); $('modal').scrollTop = 0; document.body.style.overflow = 'hidden'; $('close').focus();
    loadWiki(); loadArchive(w, c, tok);
  }
  function closeModal() { modalTok++; wikiTok++; stopPlayer(); $('modal').classList.add('hidden'); document.body.style.overflow = ''; }
  $('close').onclick = closeModal;
  $('modal').addEventListener('mousedown', e => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) closeModal(); });

  /* ---------- Wikipedia ---------- */
  async function wikiFind(host, q) {
    const u = `https://${host}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${enc(q)}&gsrlimit=1&prop=extracts|info&inprop=url&exintro=1&explaintext=1&exsentences=10&format=json&origin=*`;
    const j = await jget(u);
    const p = j.query && j.query.pages && Object.values(j.query.pages)[0];
    return p && p.extract && p.extract.trim().length > 40 ? { title: p.title, text: p.extract.trim(), url: p.fullurl } : null;
  }
  async function wikiGet(w, c) {
    const key = lang + '|' + w.id; if (wikiCache.has(key)) return wikiCache.get(key);
    const base = w.title.replace(/\(.*?\)/g, '').split(/ in |,/)[0].trim();
    const en = async missJa => {
      let x = await wikiFind('en', `${base} ${c.complete_name || c.name}`), fb = false;
      if (!x) { x = await wikiFind('en', c.complete_name || c.name); fb = !!x; }
      return x && { ...x, lang: 'en', fb, missJa };
    };
    let r = null;
    if (lang === 'ja') {
      r = await wikiFind('ja', `${jaTitle(base)} ${cfull(c)}`);
      if (r) r = { ...r, lang: 'ja', fb: false };
      else { r = await wikiFind('ja', cfull(c)); if (r) r = { ...r, lang: 'ja', fb: true }; }
      if (!r) r = await en(true);
    } else r = await en(false);
    if (r) wikiCache.set(key, r);
    return r;
  }
  async function loadWiki() {
    const tok = ++wikiTok, box = $('wiki'), w = curW, c = current;
    box.innerHTML = spinner('Wikipediaから解説を取得中…', 'Fetching description from Wikipedia…');
    try {
      const r = await wikiGet(w, c);
      if (tok !== wikiTok) return;
      if (!r) { box.innerHTML = errBox('この楽曲に関する解説が見つかりませんでした。', 'No description found for this work.'); return; }
      const notes = [];
      if (r.missJa) notes.push(tx('日本語版に該当記事が見つからなかったため、英語版を表示しています。', 'No Japanese article found; showing the English one.'));
      if (r.fb) notes.push(tx('楽曲の個別記事が見つからなかったため、作曲家の解説を表示しています。', 'No article for this specific work; showing the composer’s article.'));
      box.innerHTML = notes.map(n => `<p class="sm rose" style="margin-bottom:.5rem">${n}</p>`).join('') +
        `<div class="txt">${r.text.split(/\n+/).map(p => `<p>${esc(p)}</p>`).join('')}</div>
        <p class="sm muted" style="margin-top:.5rem">${esc(L('出典: Wikipedia', 'Source: Wikipedia'))}「${esc(r.title)}」（${esc(r.lang === 'ja' ? L('日本語版', 'Japanese edition') : L('英語版', 'English edition'))}） <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(L('記事を開く', 'Open article'))}</a></p>`;
    } catch (e) {
      if (tok === wikiTok) box.innerHTML = errBox('Wikipediaから解説を取得できませんでした。', 'Could not fetch the Wikipedia description.', e.message);
    }
  }

  /* ---------- Internet Archive ---------- */
  async function archSearch(q) {
    const u = `https://archive.org/advancedsearch.php?q=${enc(q + ' AND mediatype:audio')}&fl[]=identifier&fl[]=title&sort[]=downloads+desc&rows=10&output=json`;
    const j = await jget(u);
    return (j.response && j.response.docs) || [];
  }
  async function loadArchive(w, c, tok) {
    const box = $('arch');
    try {
      const t = w.title.replace(/\(.*?\)/g, '').split(/ in |,/)[0].trim();
      let docs = await archSearch(`${c.name} ${t}`), fallback = false;
      if (!docs.length && tok === modalTok) { docs = await archSearch(`${c.name} ${w.genre}`); fallback = true; }
      if (tok !== modalTok) return;
      if (!docs.length) { box.innerHTML = errBox('再生できるパブリックドメイン音源が見つかりませんでした。', 'No playable public-domain recordings found.'); return; }
      box.innerHTML = `${fallback ? `<p class="sm rose" style="margin-bottom:.5rem">${tx('この曲の音源は見つからなかったため、同じ作曲家・ジャンルの音源を表示しています。', 'No recording of this work was found; showing recordings by the same composer and genre.')}</p>` : ''}
        <label class="l" for="recSel">${tx('録音を選択', 'Recording')}</label>
        <select id="recSel">${docs.map(d => `<option value="${esc(d.identifier)}">${esc(d.title || d.identifier)}</option>`).join('')}</select>
        <div id="trackBox"></div>`;
      const sel = $('recSel');
      sel.onchange = () => loadItem(sel.value, tok);
      loadItem(sel.value, tok);
    } catch (e) {
      if (tok === modalTok) box.innerHTML = errBox('音源の検索に失敗しました。', 'Recording search failed.', e.message);
    }
  }
  async function loadItem(id, tok) {
    const tb = $('trackBox'); if (!tb) return;
    stopPlayer(); $('player').classList.add('hidden');
    tb.innerHTML = spinner('トラック情報を取得中…', 'Loading tracks…');
    try {
      const j = await jget(`https://archive.org/metadata/${enc(id)}`);
      if (tok !== modalTok) return;
      tracks = (j.files || []).filter(f => /\.mp3$/i.test(f.name))
        .map(f => ({ title: f.title || f.name.replace(/^.*\//, '').replace(/\.mp3$/i, ''), url: `https://archive.org/download/${enc(id)}/${f.name.split('/').map(enc).join('/')}` }));
      if (!tracks.length) { tb.innerHTML = errBox('この録音にはMP3が含まれていません。別の録音を選んでください。', 'This recording has no MP3 files. Choose another one.'); return; }
      tb.innerHTML = `<label class="l" for="trkSel">${tx(`トラック（${tracks.length}件）`, `Tracks (${tracks.length})`)}</label>
        <select id="trkSel">${tracks.map((t, i) => `<option value="${i}">${esc(t.title)}</option>`).join('')}</select>`;
      $('trkSel').onchange = e => setTrack(+e.target.value, false);
      $('player').classList.remove('hidden');
      setTrack(0, false);
    } catch (e) {
      if (tok === modalTok) tb.innerHTML = errBox('トラック情報を取得できませんでした。', 'Could not load track info.', e.message);
    }
  }

  /* ---------- プレイヤー ---------- */
  function setTrack(i, autoplay) {
    tIdx = i; const t = tracks[i]; if (!t) return;
    if ($('trkSel')) $('trkSel').value = i;
    audio.src = t.url; audio.volume = +$('vol').value;
    $('trackName').textContent = t.title; $('seek').value = 0; $('cur').textContent = '0:00'; $('dur').textContent = '0:00';
    if (autoplay) audio.play().catch(() => {});
  }
  function stopPlayer() { audio.pause(); if (audio.getAttribute('src')) { audio.removeAttribute('src'); audio.load(); } $('play').textContent = '▶'; }
  $('play').onclick = () => {
    if (!audio.getAttribute('src')) return;
    if (audio.paused) audio.play().catch(e => { $('trackName').textContent = '⚠ ' + L('再生できませんでした: ', 'Playback failed: ') + e.message; });
    else audio.pause();
  };
  audio.addEventListener('play', () => { $('play').textContent = '❚❚'; $('play').setAttribute('aria-label', L('一時停止', 'Pause')); });
  audio.addEventListener('pause', () => { $('play').textContent = '▶'; $('play').setAttribute('aria-label', L('再生', 'Play')); });
  audio.addEventListener('loadedmetadata', () => { $('dur').textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', () => {
    $('cur').textContent = fmt(audio.currentTime);
    if (audio.duration) $('seek').value = (audio.currentTime / audio.duration) * 100;
  });
  audio.addEventListener('ended', () => { if (tIdx + 1 < tracks.length) setTrack(tIdx + 1, true); });
  audio.addEventListener('error', () => { if (audio.getAttribute('src')) $('trackName').textContent = '⚠ ' + L('このトラックは再生できません。別のトラックをお試しください。', 'This track cannot be played. Try another track.'); });
  $('seek').addEventListener('input', e => { if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration; });
  $('vol').addEventListener('input', e => { audio.volume = +e.target.value; });

  applyStatic(); renderEpochs(); loadComposers();
})();
</script>
</body>
</html>
